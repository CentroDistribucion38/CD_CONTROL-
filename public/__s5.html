.s5-x { width: 34px; height: 34px; border: 0; background: transparent; font-size: 22px; line-height: 1; cursor: pointer; color: inherit }
.s5-link { border: 0; background: none; padding: 4px 2px; font: 700 12.5px var(--s5-texto); color: var(--s5-ocre-txt); cursor: pointer; text-decoration: underline; text-underline-offset: 3px }

/* CAMPOS */
.s5-campo { display: flex; flex-direction: column; gap: 5px; min-width: 0 }
.s5-campo > span { font: 700 11px var(--s5-texto); letter-spacing: .12em; text-transform: uppercase; color: var(--s5-gris) }
.s5-campo :is(input, select, textarea) { width: 100%; min-height: 44px; padding: 0 12px; border: 1.5px solid var(--s5-linea); background: #fff; font: 600 15px var(--s5-texto); color: var(--s5-tinta) }
.s5-campo textarea { padding: 10px 12px; min-height: 64px; resize: vertical; font-weight: 500; line-height: 1.4 }
.s5-campo.grande select { font: 800 18px var(--s5-titulo); letter-spacing: -.01em }
.s5-campo :is(input, select, textarea):focus { border-color: var(--s5-tinta); outline: none }

/* AVISO DE GUARDADA */
.s5-hecha { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 6px 16px; padding: 12px 12px 12px 18px; background: #fff; border: 1px solid var(--s5-linea); border-left: 6px solid var(--s5-amarillo) }
.s5-hecha > b { font: 900 34px/1 var(--s5-titulo); letter-spacing: -.03em; font-variant-numeric: tabular-nums }
.s5-hecha.bajo { border-left-color: var(--s5-rojo) }
.s5-hecha.bajo > b { color: var(--s5-rojo) }
.s5-hecha strong { display: block; font: 800 15px var(--s5-titulo) }
.s5-hecha span { font-size: 13px; color: var(--s5-gris) }

/* =========================== LA FICHA =========================== */
.s5-ficha { display: grid; grid-template-columns: minmax(220px, 1.4fr) minmax(160px, .8fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px 18px; align-items: end; padding: 16px 18px; background: #fff; border: 1px solid var(--s5-linea); border-top: 4px solid var(--s5-amarillo) }
.s5-dato { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding-bottom: 2px }
.s5-dato > span { font: 700 11px var(--s5-texto); letter-spacing: .12em; text-transform: uppercase; color: var(--s5-gris) }
.s5-dato > b { font: 800 16px var(--s5-titulo); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.s5-dato > small { font-size: 12px; color: var(--s5-gris) }

/* =========================== EL TRABAJO =========================== */
.s5-trabajo { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; align-items: start }
.s5-lista { display: flex; flex-direction: column; gap: 14px; min-width: 0 }

/* UN BLOQUE POR S */
.s5-bloque { background: #fff; border: 1px solid var(--s5-linea) }
.s5-bloque > header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; padding: 12px 16px; border-bottom: 1px solid var(--s5-linea) }
.s5-n { display: grid; place-items: center; width: 46px; height: 46px; background: var(--s5-amarillo); color: #1b1b1b; font: 900 19px var(--s5-titulo); letter-spacing: -.02em }
.s5-bloque h2 { margin: 0; font: 900 19px/1.1 var(--s5-titulo); letter-spacing: -.02em }
.s5-bloque h2 i { font: 600 12px var(--s5-texto); font-style: italic; color: var(--s5-gris); letter-spacing: 0; margin-left: 4px }
.s5-bloque header small { font-size: 12.5px; color: var(--s5-gris) }
.s5-bloque-pct { text-align: right; line-height: 1.1 }
.s5-bloque-pct b { display: block; font: 900 22px var(--s5-titulo); font-variant-numeric: tabular-nums; letter-spacing: -.02em }
.s5-bloque-pct small { font: 600 12px var(--s5-texto); color: var(--s5-gris); font-variant-numeric: tabular-nums }
.s5-bloque ol { list-style: none; margin: 0; padding: 0 }

/* UN PUNTO */
.s5-p { padding: 12px 16px 12px 12px; border-bottom: 1px solid #EEF0F3; border-left: 4px solid transparent; scroll-margin: 90px }
.s5-p:last-child { border-bottom: 0 }
.s5-p.cumple { border-left-color: var(--s5-amarillo) }
.s5-p.no_cumple { border-left-color: var(--s5-rojo); background: #FFFBFB }
.s5-p.na { border-left-color: #C3C9D1 }
.s5-p.falta { background: #FFF6E3; box-shadow: inset 0 0 0 1.5px var(--s5-ocre) }
.s5-p-cab { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px 12px; align-items: center }
.s5-p-n { font: 800 13px var(--s5-titulo); color: var(--s5-gris); text-align: right; font-variant-numeric: tabular-nums }
.s5-p-q p { margin: 0; font-size: 14.5px; font-weight: 500; line-height: 1.35 }
.s5-p-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px }
.s5-p-tags:empty { display: none }
.s5-p-tags .s5-link { padding: 0 2px; font-size: 12px }
.s5-p-tags span { padding: 1px 7px; font: 700 10.5px var(--s5-texto); letter-spacing: .06em; text-transform: uppercase; background: var(--s5-fondo); color: var(--s5-gris) }
.s5-p-tags span.foto { background: var(--s5-crema); color: var(--s5-ocre-txt) }

/* CUMPLE / NO CUMPLE / N/A — botones grandes: se responde con el pulgar. */
.s5-res { display: inline-grid; grid-template-columns: repeat(3, auto); border: 1.5px solid var(--s5-linea); background: #fff }
.s5-res button { min-height: 42px; min-width: 64px; padding: 0 14px; border: 0; border-left: 1.5px solid var(--s5-linea); background: #fff; font: 800 13px var(--s5-texto); color: var(--s5-tinta); cursor: pointer; white-space: nowrap }
.s5-res button:first-child { border-left: 0 }
.s5-res button:hover:not(:disabled):not(.on) { background: var(--s5-fondo) }
.s5-res button.cumple.on { background: var(--s5-amarillo); color: #1b1b1b; box-shadow: inset 0 -3px 0 var(--s5-ocre) }
.s5-res button.no_cumple.on { background: var(--s5-rojo); color: #fff }
.s5-res button.na.on { background: #5F6B79; color: #fff }

/* EL HALLAZGO */
.s5-hallazgo { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 10px 12px; align-items: start; margin: 10px 0 0 40px }
.s5-sev { display: inline-flex; align-items: center; border: 1.5px solid var(--s5-linea); background: #fff }
.s5-sev > span { padding: 0 10px; font: 700 10.5px var(--s5-texto); letter-spacing: .12em; text-transform: uppercase; color: var(--s5-gris) }
.s5-sev button { min-height: 38px; padding: 0 12px; border: 0; border-left: 1.5px solid var(--s5-linea); background: #fff; font: 700 12.5px var(--s5-texto); cursor: pointer; color: var(--s5-tinta) }
.s5-sev button.baja.on { background: var(--s5-amarillo); color: #1b1b1b }
.s5-sev button.media.on { background: var(--s5-ocre); color: #fff }
.s5-sev button.alta.on { background: var(--s5-carbon); color: #fff }
.s5-hallazgo textarea, .s5-obs-ok { width: 100%; min-height: 40px; padding: 9px 11px; border: 1.5px solid var(--s5-linea); background: #fff; font: 500 14px/1.4 var(--s5-texto); color: var(--s5-tinta); resize: vertical }
.s5-hallazgo textarea[aria-invalid] { border-color: var(--s5-ocre); background: #FFFDF6 }
.s5-obs-ok { display: block; margin: 10px 0 0 40px; width: calc(100% - 40px) }

/* LA ZONA DEL HALLAZGO */
.s5-zona { min-height: 40px; padding: 0 10px; border: 1.5px solid var(--s5-linea); background: #fff; font: 700 13px var(--s5-texto); color: var(--s5-tinta); max-width: 180px }
.s5-hallazgo:not(:has(.s5-zona)) { grid-template-columns: auto minmax(0, 1fr) }

/* LAS FOTOS */
.s5-fotos { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 0 40px }
.s5-fotos figure { position: relative; margin: 0; width: 76px; height: 76px; background: var(--s5-fondo) }
.s5-fotos img { width: 100%; height: 100%; object-fit: cover; display: block }
.s5-fotos figure button { position: absolute; top: 2px; right: 2px; width: 24px; height: 24px; border: 0; background: rgba(13, 13, 13, .72); color: #fff; font-size: 16px; line-height: 1; cursor: pointer }
.s5-foto-bt { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 12px; border: 1.5px dashed #AEB6C0; background: #fff; font: 700 12.5px var(--s5-texto); color: var(--s5-tinta); cursor: pointer }
.s5-foto-bt svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round }
.s5-foto-bt:hover:not(:disabled) { border-color: var(--s5-tinta) }
.s5-foto-bt.falta { border-color: var(--s5-ocre); background: var(--s5-crema); color: var(--s5-ocre-txt) }
.s5-campo.nota { padding: 14px 16px; background: #fff; border: 1px solid var(--s5-linea) }

/* =========================== EL MARCADOR =========================== */
.s5-marcador { position: sticky; top: 86px; display: flex; flex-direction: column; gap: 14px; padding: 16px; background: #fff; border: 1px solid var(--s5-linea); border-top: 4px solid var(--s5-amarillo) }
.s5-marcador.bajo { border-top-color: var(--s5-rojo) }
.s5-m-top > span { display: block; font: 700 11px var(--s5-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--s5-gris) }
.s5-m-top > b { display: block; margin-top: 2px; font: 900 56px/1 var(--s5-titulo); letter-spacing: -.045em; font-variant-numeric: tabular-nums }
.s5-marcador.bajo .s5-m-top > b { color: var(--s5-rojo) }
.s5-m-top > small { display: block; margin-top: 4px; font-size: 12.5px; font-weight: 600; color: var(--s5-gris) }
.s5-m-barra { position: relative; height: 10px; margin-top: 10px; background: #ECEEF1 }
.s5-m-barra i { position: absolute; inset: 0 auto 0 0; background: var(--s5-amarillo) }
.s5-marcador.bajo .s5-m-barra i { background: var(--s5-rojo) }
.s5-m-barra em { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--s5-tinta) }
.s5-m-s { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px }
.s5-m-s li { display: grid; grid-template-columns: 112px minmax(0, 1fr) 30px; align-items: center; gap: 8px; font-size: 12.5px }
.s5-m-s li > span { font: 800 12.5px var(--s5-titulo); white-space: nowrap }
.s5-m-s li > span em { font: 500 12px var(--s5-texto); font-style: normal; color: var(--s5-gris) }
.s5-m-s li > div { height: 8px; background: #ECEEF1; position: relative }
.s5-m-s li > div i { position: absolute; inset: 0 auto 0 0; background: var(--s5-carbon) }
.s5-m-s li > div i.bajo { background: var(--s5-rojo) }
.s5-m-s li > b { font: 800 13px var(--s5-titulo); text-align: right; font-variant-numeric: tabular-nums }
.s5-m-cuenta { margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--s5-linea) }
.s5-m-cuenta div { padding: 8px 6px; text-align: center; border-left: 1px solid var(--s5-linea) }
.s5-m-cuenta div:first-child { border-left: 0 }
.s5-m-cuenta dt { font: 700 10px var(--s5-texto); letter-spacing: .08em; text-transform: uppercase; color: var(--s5-gris) }
.s5-m-cuenta dd { margin: 2px 0 0; font: 900 20px var(--s5-titulo); font-variant-numeric: tabular-nums }
.s5-m-cuenta .nc dd { color: var(--s5-rojo) }
.s5-m-faltas { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; background: #FFF6E3; border-left: 4px solid var(--s5-ocre); font-size: 12.5px; font-weight: 700; color: var(--s5-ocre-txt) }
.s5-m-faltas p { margin: 0 }
.s5-m-faltas button { border: 0; background: none; font: 800 12.5px var(--s5-texto); color: var(--s5-tinta); cursor: pointer; white-space: nowrap; text-decoration: underline }
.s5-m-nota { margin: 0; font-size: 12.5px; color: var(--s5-gris) }
.s5-guardar { min-height: 52px; font-size: 15px }

/* =========================== HISTORIAL =========================== */
.s5-filtros { display: flex; gap: 10px 12px; flex-wrap: wrap; align-items: end }
.s5-filtros .s5-campo { width: auto; min-width: 180px }
.s5-filtros .s5-campo :is(select, input) { min-height: 40px; font-size: 14px }
.s5-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
.s5-kpi { padding: 14px 16px; background: #fff; border: 1px solid var(--s5-linea); border-top: 4px solid var(--s5-amarillo); min-width: 0 }
.s5-kpi.bajo { border-top-color: var(--s5-rojo) }
.s5-kpi span { display: block; font: 700 10.5px var(--s5-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--s5-gris) }
.s5-kpi b { display: block; margin-top: 4px; font: 900 34px/1 var(--s5-titulo); letter-spacing: -.035em; font-variant-numeric: tabular-nums }
.s5-kpi.bajo b { color: var(--s5-rojo) }
.s5-kpi small { display: block; margin-top: 4px; font-size: 12px; color: var(--s5-gris) }
.s5-tabla-caja { background: #fff; border: 1px solid var(--s5-linea); overflow-x: auto }
.s5-tabla { width: 100%; border-collapse: collapse; font-size: 13.5px }
.s5-tabla th { position: sticky; top: 0; padding: 10px 12px; text-align: left; font: 700 10.5px var(--s5-texto); letter-spacing: .12em; text-transform: uppercase; color: var(--s5-gris); background: #fff; border-bottom: 2px solid var(--s5-amarillo); white-space: nowrap }
.s5-tabla td { padding: 10px 12px; border-bottom: 1px solid #EEF0F3; vertical-align: middle }
.s5-tabla tr.fila { cursor: pointer }
.s5-tabla tr.fila:hover td { background: #FFFBEE }
.s5-tabla tr.abierta td { background: #FFF6DA }
.s5-tabla .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
.s5-tabla .pct { font: 900 17px var(--s5-titulo); letter-spacing: -.02em }
.s5-tabla .pct.bajo { color: var(--s5-rojo) }
.s5-tabla .nc { color: var(--s5-rojo); font-weight: 800 }
.s5-tabla .fecha b { display: block; font: 800 14px var(--s5-titulo) }
.s5-tabla .fecha small { color: var(--s5-gris); font-size: 12px }
.s5-tabla th.inf, .s5-tabla td.inf { width: 1%; white-space: nowrap; text-align: right }
.s5-tabla td.inf { cursor: default }
.s5-ico { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; margin-left: 6px; border: 1.5px solid var(--s5-tinta); background: #fff; color: var(--s5-tinta) }
.s5-ico.osc { background: var(--s5-amarillo); border-color: var(--s5-amarillo); color: #1b1b1b; box-shadow: inset 0 -3px 0 var(--s5-ocre) }
.s5-ico svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.s5-ico:hover { background: var(--s5-crema) }
.s5-ico.osc:hover { filter: brightness(.96) }
.s5-mini { display: inline-grid; grid-template-columns: repeat(5, 9px); gap: 3px; align-items: end; height: 26px }
.s5-mini i { display: block; background: var(--s5-carbon); min-height: 2px }
.s5-mini i.bajo { background: var(--s5-rojo) }
.s5-mini i.nada { background: #E3E6EA; height: 2px }

/* EL DETALLE DE UNA INSPECCIÓN */
.s5-det { padding: 16px 18px 20px; background: #FFFCF3; border-bottom: 2px solid var(--s5-amarillo) }
.s5-det-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 360px); gap: 16px 24px }
.s5-det h3 { margin: 0 0 8px; font: 900 16px var(--s5-titulo); padding-left: 10px; border-left: 4px solid var(--s5-amarillo) }
.s5-det-s { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px }
.s5-det-s li { display: grid; grid-template-columns: 120px minmax(0, 1fr) 46px; gap: 8px; align-items: center; font-size: 12.5px }
.s5-det-s li > span { font: 800 12.5px var(--s5-titulo) }
.s5-det-s li > div { height: 9px; background: #ECEEF1; position: relative }
.s5-det-s li > div i { position: absolute; inset: 0 auto 0 0; background: var(--s5-carbon) }
.s5-det-s li > div i.bajo { background: var(--s5-rojo) }
.s5-det-s li > b { text-align: right; font: 800 13px var(--s5-titulo); font-variant-numeric: tabular-nums }
.s5-det-meta { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px }
.s5-det-meta dt { color: var(--s5-gris); font-weight: 600 }
.s5-det-meta dd { margin: 0; font-weight: 700 }
.s5-hallazgos { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px }
.s5-hz { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 4px 14px; padding: 10px 12px; background: #fff; border: 1px solid var(--s5-linea); border-left: 4px solid var(--s5-rojo) }
.s5-hz.ok { border-left-color: var(--s5-amarillo) }
.s5-hz-sev { align-self: start; padding: 3px 6px; text-align: center; font: 800 10.5px var(--s5-texto); letter-spacing: .08em; text-transform: uppercase }
.s5-hz-sev.alta { background: var(--s5-carbon); color: #fff }
.s5-hz-sev.media { background: var(--s5-ocre); color: #fff }
.s5-hz-sev.baja { background: var(--s5-amarillo); color: #1b1b1b }
.s5-hz-sev.nota { background: var(--s5-fondo); color: var(--s5-gris) }
.s5-hz b { font-size: 13.5px }
.s5-hz b em { font-style: normal; font: 800 11px var(--s5-titulo); color: var(--s5-gris); margin-right: 6px }
.s5-hz p { margin: 2px 0 0; font-size: 13.5px; line-height: 1.4 }
.s5-hz .s5-fotos { margin: 8px 0 0 }
.s5-hz .s5-fotos a { display: block; width: 92px; height: 92px; background: var(--s5-fondo) }
.s5-hz .s5-fotos img { width: 100%; height: 100%; object-fit: cover; display: block }
.s5-det-pie { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px }
.s5-det-pie p { margin: 0; font-size: 12.5px; color: var(--s5-gris) }
.s5-todos summary { cursor: pointer; font: 800 13px var(--s5-texto); margin-top: 14px }
.s5-todos ol { margin: 8px 0 0; padding-left: 22px; font-size: 13px; display: flex; flex-direction: column; gap: 3px }
.s5-todos li span { font: 800 10.5px var(--s5-texto); letter-spacing: .06em; text-transform: uppercase; margin-left: 6px; padding: 1px 6px }
.s5-todos li span.cumple { background: var(--s5-crema); color: var(--s5-ocre-txt) }
.s5-todos li span.no_cumple { background: var(--s5-rojo-suave); color: var(--s5-rojo) }
.s5-todos li span.na { background: var(--s5-fondo); color: var(--s5-gris) }

/* =========================== MAESTRO =========================== */
.s5-tabs { display: flex; flex-wrap: wrap; border-bottom: 2px solid var(--s5-linea) }
.s5-tabs button { min-height: 44px; padding: 0 18px; border: 0; background: none; font: 800 14px var(--s5-titulo); color: var(--s5-gris); cursor: pointer; margin-bottom: -2px; border-bottom: 3px solid transparent }
.s5-tabs button.on { color: var(--s5-tinta); border-bottom-color: var(--s5-amarillo) }
.s5-tabs button i { font-style: normal; font-weight: 600; margin-left: 6px; opacity: .7 }
.s5-card { background: #fff; border: 1px solid var(--s5-linea) }
.s5-card > header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--s5-linea) }
.s5-card > header h2 { margin: 0; font: 900 17px var(--s5-titulo); padding-left: 10px; border-left: 4px solid var(--s5-amarillo) }
.s5-card > header p { margin: 2px 0 0; font-size: 12.5px; color: var(--s5-gris); width: 100% }
.s5-filas { list-style: none; margin: 0; padding: 0 }
.s5-fila { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 11px 16px; border-bottom: 1px solid #EEF0F3 }
.s5-fila:last-child { border-bottom: 0 }
.s5-fila.inactiva { opacity: .55 }
.s5-fila b { font: 800 14.5px var(--s5-titulo) }
.s5-fila small { display: block; font-size: 12.5px; color: var(--s5-gris); margin-top: 2px }
.s5-fila .s5-acc button { min-height: 34px; padding: 0 12px; font-size: 12.5px }
.s5-chip { display: inline-block; margin-left: 6px; padding: 1px 7px; font: 700 10.5px var(--s5-texto); letter-spacing: .06em; text-transform: uppercase; background: var(--s5-fondo); color: var(--s5-gris); vertical-align: middle }
.s5-chip.foto { background: var(--s5-crema); color: var(--s5-ocre-txt) }
.s5-chip.area { background: #E9EEF5; color: var(--s5-tinta) }
.s5-meta-gen { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; padding: 14px 16px }
.s5-meta-gen .s5-campo { width: 140px }

/* LAS ZONAS DE UN ÁREA */
.s5-zonas { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px }
.s5-zonas > span:first-child { font: 700 10px var(--s5-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--s5-gris); margin-right: 2px }
.s5-zonas em { font-size: 12px; color: var(--s5-gris) }
.s5-zona-chip { display: inline-flex; align-items: center; gap: 2px; padding: 2px 4px 2px 9px; background: #E9EEF5; font: 700 11.5px var(--s5-texto) }
.s5-zona-chip button { width: 22px; height: 22px; border: 0; background: none; cursor: pointer; font-size: 15px; line-height: 1; color: var(--s5-gris) }
.s5-zona-chip button:hover { color: var(--s5-rojo) }
.s5-zona-nueva { display: inline-flex; align-items: center; gap: 6px }
.s5-zona-nueva input { width: 140px; min-height: 32px; padding: 0 8px; border: 1.5px solid var(--s5-tinta); font: 700 12.5px var(--s5-texto); text-transform: uppercase }
.s5-zona-nueva .s5-bt { min-height: 32px; padding: 0 10px; font-size: 12px }

/* LA VENTANA DE EDITAR — cabeza de cierre: cinta de la marca, logo, título grande. */
.s5-mo-cab { position: relative; display: flex; align-items: center; gap: 16px; padding: 20px 18px 16px; background: #fff; border-bottom: 4px solid var(--s5-amarillo) }
.s5-mo-cab .cinta { position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, #B8860B 0%, #FFC300 35%, #E30613 100%) }
.s5-mo-cab img { height: 34px; width: auto; flex: none }
.s5-mo-cab .sep { width: 1px; align-self: stretch; background: var(--s5-linea) }
.s5-mo-cab div { flex: 1; min-width: 0 }
.s5-mo-cab p { margin: 0; font: 700 10.5px var(--s5-texto); letter-spacing: .18em; color: var(--s5-ocre-txt) }
.s5-mo-cab h3 { margin: 3px 0 0; font: 900 24px/1.1 var(--s5-titulo); letter-spacing: -.02em }
.s5-mo-x { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex: none; border: 1px solid var(--s5-linea); background: #fff; color: var(--s5-tinta); cursor: pointer }
.s5-mo-x svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2 }
.s5-mo-x:hover { border-color: var(--s5-tinta) }
.s5-mo-res { display: grid; grid-template-columns: 1.3fr 1.2fr 1.2fr .8fr; background: #FFFBEA; border-bottom: 1px solid var(--s5-linea) }
.s5-mo-res > div { padding: 12px 16px; border-left: 1px solid #F1E3B0; min-width: 0 }
.s5-mo-res > div:first-child { border-left: 0 }
.s5-mo-res span { display: block; font: 700 9.5px var(--s5-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--s5-gris) }
.s5-mo-res b { display: block; margin-top: 3px; font: 900 17px/1.15 var(--s5-titulo); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.s5-mo-res .area b { font-size: 20px }
.s5-mo-res b.sin { color: var(--s5-ocre-txt) }
.s5-mo-res small { font-size: 11.5px; color: var(--s5-gris) }
.s5-mo-res.p-alta .prio { background: var(--s5-rojo); }
.s5-mo-res.p-alta .prio span, .s5-mo-res.p-alta .prio b { color: #fff }
.s5-mo-res.p-media .prio { background: var(--s5-amarillo) }
.s5-mo-res.p-media .prio span { color: #1b1b1b }
.s5-mo { width: min(640px, 100%) }
/* La etiqueta de una barra que no cabe adentro: al lado, en tinta. */
.s5-g-bar > span.fuera { position: absolute; left: calc(100% + 6px); top: 50%; transform: translateY(-50%); overflow: visible; color: var(--s5-tinta); font-weight: 800; white-space: nowrap; pointer-events: none }

/* LA VENTANA DE EDITAR (cuerpo) */
.s5-velo { position: fixed; inset: 0; z-index: 900; display: grid; place-items: center; padding: 16px; background: rgba(10, 16, 24, .6) }
.s5-mo { width: min(560px, 100%); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; background: #fff; box-shadow: 0 24px 60px rgba(0, 0, 0, .35) }
.s5-mo > header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 4px solid var(--s5-amarillo) }
.s5-mo > header div { flex: 1; min-width: 0 }
.s5-mo > header p { margin: 0; font: 700 10px var(--s5-texto); letter-spacing: .16em; color: var(--s5-ocre-txt) }
.s5-mo > header h3 { margin: 3px 0 0; font: 900 19px/1.15 var(--s5-titulo) }
.s5-mo-b { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; padding: 16px; overflow: auto }
.s5-mo-b .ancho { grid-column: 1 / -1 }
.s5-mo-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--s5-linea) }
.s5-check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; font-weight: 600; cursor: pointer }
.s5-check input { width: 20px; height: 20px; accent-color: #1b1b1b }
.s5-s-pick { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1.5px solid var(--s5-linea) }
.s5-s-pick button { min-height: 52px; padding: 4px 2px; border: 0; border-left: 1.5px solid var(--s5-linea); background: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px }
.s5-s-pick button:first-child { border-left: 0 }
.s5-s-pick button b { font: 900 15px var(--s5-titulo) }
.s5-s-pick button span { font-size: 10.5px; font-weight: 600; color: var(--s5-gris) }
.s5-s-pick button.on { background: var(--s5-amarillo); box-shadow: inset 0 -3px 0 var(--s5-ocre) }
.s5-s-pick button.on span { color: #1b1b1b }


/* =========================== CRONOGRAMA · GANTT =========================== */
.s5-seg { display: inline-flex; border: 1.5px solid var(--s5-linea); background: #fff }
.s5-seg button { min-height: 38px; padding: 0 13px; border: 0; border-left: 1.5px solid var(--s5-linea); background: #fff; font: 700 12.5px var(--s5-texto); color: var(--s5-tinta); cursor: pointer; white-space: nowrap }
.s5-seg button:first-child { border-left: 0 }
.s5-seg button.on { background: var(--s5-crema); box-shadow: inset 0 -3px 0 var(--s5-amarillo) }
.s5-seg.ancho { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) }
.s5-gantt-barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.s5-leyenda { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto }
.s5-leyenda .est { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 10px; border: 1px solid var(--s5-linea); background: #fff; font: 700 12px var(--s5-texto); color: var(--s5-tinta); cursor: pointer }
.s5-leyenda .est b { font: 800 12px var(--s5-titulo); color: var(--s5-gris) }
.s5-leyenda .est i { width: 16px; height: 10px; display: inline-block }
.s5-leyenda .est.apagado { opacity: .45; text-decoration: line-through }
.est.programada i, .s5-g-bar.programada { background: #fff; border: 1.5px solid var(--s5-tinta) }
.est.en_curso i, .s5-g-bar.en_curso { background: var(--s5-amarillo); border: 1.5px solid var(--s5-ocre) }
.est.hecha i, .s5-g-bar.hecha { background: var(--s5-carbon); border: 1.5px solid var(--s5-carbon); color: #fff }
.est.vencida i, .s5-g-bar.vencida { background: var(--s5-rojo); border: 1.5px solid var(--s5-rojo); color: #fff }
.est.cancelada i, .s5-g-bar.cancelada { background: repeating-linear-gradient(135deg, #EEF0F2 0 5px, #fff 5px 10px); border: 1.5px dashed #AEB6C0; color: var(--s5-gris) }
.s5-chip.est-en_curso { background: var(--s5-amarillo); color: #1b1b1b }
.s5-chip.est-vencida { background: var(--s5-rojo-suave); color: var(--s5-rojo) }

.s5-gantt { --s5-g-izq: 210px; background: #fff; border: 1px solid var(--s5-linea); overflow-x: auto; overscroll-behavior-x: contain }
.s5-g-in { display: grid; width: max-content; min-width: 100% }
.s5-g-esq { position: sticky; left: 0; z-index: 4; display: flex; align-items: flex-end; padding: 0 14px 8px; background: #fff; border-right: 1px solid var(--s5-linea); border-bottom: 2px solid var(--s5-amarillo); font: 700 10.5px var(--s5-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--s5-gris) }
.s5-g-cab { border-bottom: 2px solid var(--s5-amarillo) }
.s5-g-cab > div { display: flex }
.s5-g-cab span { flex: none; overflow: hidden; white-space: nowrap }
.s5-g-meses span { padding: 6px 8px 2px; font: 900 13px var(--s5-titulo); text-transform: capitalize; border-left: 1px solid var(--s5-linea) }
.s5-g-sem span { padding: 2px 6px; font: 700 10.5px var(--s5-texto); color: var(--s5-gris); border-left: 1px solid var(--s5-linea) }
.s5-g-dias span { height: 22px; display: grid; place-items: center; font: 600 10.5px var(--s5-texto); color: var(--s5-gris); font-variant-numeric: tabular-nums }
.s5-g-dias span.fds { background: #F6F7F8 }
.s5-g-dias span.hoy { background: var(--s5-amarillo); color: #1b1b1b; font-weight: 800 }
.s5-g-nom { position: sticky; left: 0; z-index: 3; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 0 14px; background: #fff; border-right: 1px solid var(--s5-linea); border-bottom: 1px solid #EEF0F3; min-width: 0 }
.s5-g-nom b { font: 800 13.5px var(--s5-titulo); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.s5-g-nom small { font-size: 11.5px; color: var(--s5-gris) }
.s5-g-pista { position: relative; border-bottom: 1px solid #EEF0F3 }
.s5-g-pista > i { position: absolute; top: 0; bottom: 0 }
.s5-g-pista > i.fds { background: #F8F9FA }
.s5-g-pista > i.sem { width: 1px; background: #E6E9ED }
.s5-g-pista > i.hoy { width: 2px; margin-left: -1px; background: var(--s5-ocre); z-index: 2 }
.s5-g-bar { position: absolute; z-index: 1; height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 8px; overflow: visible; font: 700 11.5px var(--s5-texto); color: var(--s5-tinta); cursor: pointer; text-align: left; white-space: nowrap }
.s5-g-bar > span { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 }
.s5-g-bar > b { font: 900 12px var(--s5-titulo); flex: none }
.s5-g-bar > b.bajo { color: #FFB4BE }
.s5-g-bar .prio { font: 900 12px var(--s5-titulo); font-style: normal; color: var(--s5-rojo); flex: none }
.s5-g-bar.vencida .prio { color: #fff }
.s5-g-bar.corta-i { border-left-style: dotted }
.s5-g-bar.corta-d { border-right-style: dotted }
.s5-g-bar .rombo { position: absolute; top: -6px; width: 10px; height: 10px; background: var(--s5-amarillo); border: 1.5px solid #1b1b1b; transform: rotate(45deg) }
.s5-g-bar:hover { filter: brightness(.96); box-shadow: 0 2px 8px rgba(0, 0, 0, .18) }
.s5-g-bar:focus-visible { outline: 3px solid var(--s5-marca); outline-offset: 1px }


/* =========================== TABLERO =========================== */
.s5-kpi b i.de { font: 700 14px var(--s5-texto); font-style: normal; color: var(--s5-gris); letter-spacing: 0 }
.s5-tab-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start }
.s5-tab-ancho { grid-column: 1 / -1 }
.s5-card > header p { margin: 0; font-size: 12.5px; color: var(--s5-gris); width: 100% }
.s5-barras { list-style: none; margin: 0; padding: 6px 16px 14px; display: flex; flex-direction: column }
.s5-barras li { display: grid; grid-template-columns: minmax(180px, 260px) minmax(0, 1fr) 70px 96px; gap: 14px; align-items: center; padding: 9px 0; border-bottom: 1px solid #EEF0F3 }
.s5-barras li:last-child { border-bottom: 0 }
.s5-barras .nom b { display: block; font: 800 14px var(--s5-titulo) }
.s5-barras .nom small { font-size: 11.5px; color: var(--s5-gris) }
.s5-barras .barra, .s5-rep .barra { position: relative; height: 12px; background: #ECEEF1 }
.s5-barras .barra i, .s5-rep .barra i { position: absolute; inset: 0 auto 0 0; background: var(--s5-carbon) }
.s5-barras .barra i.bajo { background: var(--s5-rojo) }
.s5-barras .barra em { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--s5-tinta) }
.s5-barras .v { font: 900 17px var(--s5-titulo); text-align: right; font-variant-numeric: tabular-nums }
.s5-barras .v.bajo { color: var(--s5-rojo) }
.s5-barras .hz { font-size: 12px; color: var(--s5-gris); text-align: right }
.s5-cols-s { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; padding: 14px 18px 18px }
.s5-cols-s > div { display: flex; flex-direction: column; align-items: center; gap: 6px }
.s5-cols-s .v { font: 900 20px var(--s5-titulo); font-variant-numeric: tabular-nums }
.s5-cols-s .bajo .v { color: var(--s5-rojo) }
.s5-cols-s .col { position: relative; width: 100%; max-width: 56px; height: 160px; background: #ECEEF1 }
.s5-cols-s .col i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--s5-carbon) }
.s5-cols-s .bajo .col i { background: var(--s5-rojo) }
.s5-cols-s .col em { position: absolute; left: -4px; right: -4px; height: 2px; background: var(--s5-tinta) }
.s5-cols-s span { display: flex; flex-direction: column; align-items: center; font-size: 11.5px; color: var(--s5-gris); text-align: center }
.s5-cols-s span b { font: 900 14px var(--s5-titulo); color: var(--s5-tinta) }
.s5-tend { display: block; width: 100%; height: auto; padding: 8px 14px 12px }
.s5-tend .eje { font: 600 10px var(--s5-texto); fill: var(--s5-gris) }
.s5-tend .eje.fuerte { fill: var(--s5-tinta); font-weight: 800 }
.s5-tend .val { font: 800 11px var(--s5-titulo); fill: var(--s5-tinta) }
.s5-rep { list-style: none; margin: 0; padding: 4px 16px 14px }
.s5-rep li { display: grid; grid-template-columns: 36px minmax(0, 1fr) 40px; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid #EEF0F3 }
.s5-rep li:last-child { border-bottom: 0 }
.s5-rep .s { display: grid; place-items: center; height: 30px; background: var(--s5-amarillo); font: 900 12px var(--s5-titulo) }
.s5-rep p { margin: 0; font-size: 13px; font-weight: 600; line-height: 1.3 }
.s5-rep small { display: block; font-size: 11.5px; color: var(--s5-gris); margin: 2px 0 5px }
.s5-rep .barra { height: 6px }
.s5-rep .barra i { background: var(--s5-rojo) }
.s5-rep li > b { font: 900 17px var(--s5-titulo); text-align: right; color: var(--s5-rojo) }

/* =========================== CELULAR Y TABLET =========================== */
@media (max-width: 1100px) {
  .s5-trabajo { grid-template-columns: minmax(0, 1fr) }
  /* EL MARCADOR BAJA Y SE QUEDA PEGADO ABAJO: el % y Guardar siempre a la mano. Lo de cada S ya está en su bloque. */
  .s5-marcador { position: sticky; top: auto; bottom: 0; z-index: 20; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px 14px; padding: 10px 62px 10px 14px; box-shadow: 0 -8px 24px rgba(0, 0, 0, .1) }
  .s5-m-s, .s5-m-cuenta { display: none }
  .s5-m-top > span { display: none }
  .s5-m-top > b { font-size: 34px }
  .s5-m-top > small { font-size: 12px }
  .s5-m-barra { display: none }
  .s5-m-faltas { grid-column: 1 / -1; order: -1 }
  .s5-guardar { min-height: 48px; padding: 0 18px }
  .s5-ficha { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) }
  .s5-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .s5-det-top { grid-template-columns: minmax(0, 1fr) }
  .s5-tab-grid { grid-template-columns: minmax(0, 1fr) }
  .s5-barras li { grid-template-columns: minmax(0, 1fr) 70px; gap: 6px 12px }
  .s5-barras .barra { grid-column: 1 / -1; grid-row: 2 }
  .s5-barras .hz { display: none }
}
@media (max-width: 640px) {
  .s5-cab h1 { font-size: 26px }
  .s5-ficha { grid-template-columns: minmax(0, 1fr); padding: 14px }
  .s5-ficha .s5-dato { flex-direction: row; align-items: baseline; gap: 8px; flex-wrap: wrap }
  .s5-p { padding: 12px 12px 12px 10px }
  .s5-p-cab { grid-template-columns: 22px minmax(0, 1fr) }
  .s5-res { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) }
  .s5-res button { min-height: 46px; min-width: 0; padding: 0 6px }
  .s5-hallazgo, .s5-hallazgo:not(:has(.s5-zona)) { grid-template-columns: minmax(0, 1fr); margin-left: 0 }
  .s5-zona { max-width: none; width: 100% }
  .s5-sev { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)) }
  .s5-fotos, .s5-obs-ok { margin-left: 0 }
  .s5-obs-ok { width: 100% }
