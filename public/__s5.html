/* =====================================================================
   LA PALETA — un solo lugar donde vive el color
   =====================================================================

   Cada tono de marca de la aplicación es una variable. El nombre del
   token ES su valor en el tema oficial: --c-2c4361 vale #2C4361. Así,
   leyendo cualquier hoja de estilos, se sabe de qué color se habla sin
   venir a buscar la tabla.

   Cambiar de tema es cambiar los VALORES, nunca las hojas.

   LOS CUATRO TEMAS
     oficial   El azul marino y el rojo de siempre. El que ve todo el
               mundo si no cambia nada.
     tinta     El mismo azul marino, con el acento en ámbar. Los neutros
               son idénticos al oficial: solo cambia el acento.
     pizarra   Pizarra y turquesa.
     ambar     Grafito y ámbar sobre papel cálido.

   CÓMO SE ARMARON
   Los tonos que elegiste van tal cual, como ANCLAS —van marcados con
   «← tuyo»—. Los otros sesenta y tres se derivan de ellas: cada uno
   conserva EXACTAMENTE su lightness y solo se le mueve el tono y el
   croma, interpolados entre tus anclas. Al conservar el lightness se
   conserva el contraste, así que ningún texto se vuelve ilegible al
   cambiar de tema.

   EL ACENTO Y SU TEXTO VAN JUNTOS
   --c-marca y --c-marca-txt son un par. Un acento claro necesita texto
   oscuro; separarlos es como se termina con blanco sobre amarillo. En
   los tres temas tuyos el texto sobre el acento es la tinta del propio
   tema, y los cuatro pares pasan 4,5:1 —el turquesa con blanco daba
   3,07:1 y no pasaba, por eso lleva su tinta encima—.

   LO QUE NO CAMBIA EN NINGÚN TEMA
   El verde de "cumple", el rojo de "por encima de la meta" y el vino de
   "el mes va corto" son SEMÁFORO: significan algo. Si cambiaran de tema
   en tema el color dejaría de decir nada. El logo tampoco se toca: es
   una imagen, no un color.
   --------------------------------------------------------------------- */

:root {

  /* Fondos y líneas muy claras */

  /* Translúcidos */

  --c-velo-hondo: rgba(4,32,63,.90);
  --c-raya:       rgba(11,114,133,.35);
  --c-degrade:    rgba(139,155,179,.40);

  /* El acento de marca y el texto que va ENCIMA de él. Van
     juntos a propósito: un acento claro necesita texto oscuro,
     y separarlos es como se termina con blanco sobre amarillo. */
  --c-marca:      #e4002b;
  --c-marca-txt:  #ffffff;
  /* Estos dos van con el hex de siempre, no con el derivado: el tema
     oficial tiene que quedar idéntico al que ya estaba. */
  --c-marca-vivo: #ff1c38;   /* hover */
  --c-marca-hondo: #b8001f;
  --c-marca-filo: #e2313c;
  --c-marca-velo: rgba(228,0,43,.14);
  --c-oro:        #e9a81f;   /* "ojo con esto" */

  /* La alarma del KPI: "el mes va corto de meta". Sigue siendo roja en
     todos los temas porque significa algo, pero cada tema la lleva a la
     temperatura de su mundo y, sobre todo, SATURADA. El #8A2033 de
     siempre tiene el croma en 0,14 y sobre papel cálido se veía apagado
     y medio morado; estos van en el 94% del máximo de su tono. */
  --c-alarma:     #8a2033;
  --c-alarma-txt: #ffffff;

  /* La franja oscura que agrupa columnas en las tablas —VEHÍCULOS,
     HECTOLITROS—. No se deriva del acento: en el tema ámbar el acento
     oscurecido da oliva, y una franja oliva al lado de una gris se ve
     como un error, no como un diseño. Cada tema lleva su propio azul
     oscuro; en ámbar es el grafito, que es el que tú elegiste. */
  --c-grupo:      #075661;
}

/* --- Tinta y ámbar ------------------------------------------------- */
[data-tema="tinta"] {
  /* Los neutros son los MISMOS del oficial: en este tema solo
     cambia el acento, y por eso no hay que redeclarar los 68
     tonos. Menos texto que mantener, y una diferencia menos
     que se pueda desincronizar. */

  /* El acento de marca y el texto que va ENCIMA de él. Van
     juntos a propósito: un acento claro necesita texto oscuro,
     y separarlos es como se termina con blanco sobre amarillo. */
  --c-marca:      #f0b429;
  --c-marca-txt:  #04203f;
  --c-marca-vivo: #ffc859;   /* hover */
  --c-marca-hondo: #d19900;
  --c-marca-filo: #f0b429;
  --c-marca-velo: rgba(240,180,41,.16);
  --c-oro:        #0b4ea2;   /* "ojo con esto" */
  --c-alarma:     #a6143b;
  --c-alarma-txt: #ffffff;
  --c-grupo:      #0a3a6e;

  /* Los alias de Tailwind y los antiguos --bv-* se resuelven en :root,
     que está por FUERA de este bloque, así que hay que volver a
     declararlos aquí. Es el mismo texto: cambia contra qué se resuelve. */
  --color-bv-azul:        var(--c-0060b0);
  --color-bv-azul-oscuro: var(--c-004a8a);
  --color-bv-tinta:       var(--c-f4f7fb);
  --color-bv-linea:       var(--c-dbe4f0);
  --color-bv-texto:       var(--c-0b1f35);
  --color-bv-texto-2:     var(--c-5a7192);
  --bv-azul:              var(--c-0060b0);
  --bv-azul-oscuro:       var(--c-004a8a);
  --bv-tinta:             var(--c-f4f7fb);
  --bv-linea:             var(--c-dbe4f0);
  --bv-texto:             var(--c-0b1f35);
  --bv-texto-2:           var(--c-5a7192);

  /* Y el color y el fondo, por lo mismo: `body { color: var(--bv-texto) }`
     ya quedó resuelto en el body con el valor oficial, así que todo texto
     que solo HEREDA su color se veía del tema anterior. */
  color: var(--bv-texto);
  background: var(--bv-tinta);
}

  --c-marca-vivo: #ffd24d;   /* hover */
  --c-marca-hondo: #d9a300;
  --c-marca-filo: #ffc000;
  --c-marca-velo: rgba(255,192,0,.18);

  /* Tu #FF0000 es el "ojo con esto" de estos tres temas. Va tal cual
     donde es MANCHA —el avatar, el tajo del sello, la marca de una
     cifra en alerta—, que es como lo usaste en el mockup. */
  --c-oro:        #ff0000;   /* ← tuyo */

  /* La alarma del KPI —"el mes va corto de meta"— lleva texto blanco
     encima. #FF0000 con blanco da 4,00:1 y no pasa 4,5:1, así que aquí
     va el mismo rojo un paso más hondo: 5,9:1 y se lee como el mismo
     color. Es el único sitio donde tu rojo no va literal, y es porque
     ahí es texto y no mancha. */
  --c-alarma:     #c00000;
  --c-alarma-txt: #ffffff;

  /* La franja que agrupa columnas en las tablas. Gris oscuro, como
     todo lo demás de estos temas. */
  --c-grupo:      #3a3a3a;

  /* Los alias de Tailwind y los antiguos --bv-* se resuelven en :root,
     que está por FUERA de este bloque: hay que volver a declararlos. */
  --color-bv-azul:        var(--c-0060b0);
  --color-bv-azul-oscuro: var(--c-004a8a);
  --color-bv-tinta:       var(--c-f4f7fb);
  --color-bv-linea:       var(--c-dbe4f0);
  --color-bv-texto:       var(--c-0b1f35);
  --color-bv-texto-2:     var(--c-5a7192);
  --bv-azul:              var(--c-0060b0);
  --bv-azul-oscuro:       var(--c-004a8a);
  --bv-tinta:             var(--c-f4f7fb);
  --bv-linea:             var(--c-dbe4f0);
  --bv-texto:             var(--c-0b1f35);
  --bv-texto-2:           var(--c-5a7192);

  /* Y el color y el fondo, por lo mismo. */
  color: var(--bv-texto);
  background: var(--bv-tinta);
}

/* El fondo del body, por el rebote del celular: cuando se arrastra más
   allá del final, asoma el body y se vería la franja del otro tema. */
body:has(.sh[data-tema="tinta"])   { background: #f4f7fb }
body:has(.sh[data-tema="pizarra"]) { background: #f2f6f6 }
body:has(.sh[data-tema="ambar"])   { background: #f7f7f3 }
body:has(.sh[data-tema="negro"])   { background: #f1f1f1 }
body:has(.sh[data-tema="gris"])    { background: #ededed }
body:has(.sh[data-tema="halo"])    { background: #f1f1f1 }
body:has(.sh[data-tema="negro"])   { background: #f1f1f1 }
body:has(.sh[data-tema="gris"])    { background: #ededed }
body:has(.sh[data-tema="halo"])    { background: #f1f1f1 }


/* ---------------------------------------------------------------------
   Paleta clara. Los nombres de las variables se mantienen para no tener
   que tocar los componentes: solo cambian los valores.
     bv-tinta   → fondo de la página
     bv-panel   → fondo de tarjetas y menús
     bv-linea   → bordes
     bv-texto   → texto principal
     bv-texto-2 → texto secundario
   --------------------------------------------------------------------- */

@theme {
  --color-bv-azul: #0060b0;
  --color-bv-azul-oscuro: #004a8a;
  --color-bv-tinta: #f4f7fb;
  --color-bv-panel: #ffffff;
  --color-bv-linea: #dbe4f0;
  --color-bv-texto: #0b1f35;
  --color-bv-texto-2: #5a7192;
  --color-bv-alerta: #b26a00;
  --color-bv-ok: #16794a;

  --sombra-suave: 0 1px 2px rgba(16,32,58,.05), 0 10px 24px -14px rgba(16,32,58,.28);
  --radius-bv: 12px;
  --radius-bv-sm: 6px;
}

:root {
  --bv-azul: var(--c-0060b0);
  --bv-azul-oscuro: var(--c-004a8a);
  --bv-tinta: var(--c-f4f7fb);
  --bv-panel: #ffffff;
  --bv-linea: var(--c-dbe4f0);
  --bv-texto: var(--c-0b1f35);
  --bv-texto-2: var(--c-5a7192);
  --bv-alerta: #b26a00;

  --sombra-suave: 0 1px 2px rgba(16,32,58,.05), 0 10px 24px -14px rgba(16,32,58,.28);
  --bv-radio: 3px;
  --bv-radio-sm: 2px;

  color-scheme: light;
}

html,
body {
  background: var(--bv-tinta);
  color: var(--bv-texto);
}

/* --- Superficies ---------------------------------------------------- */
.tarjeta {
  @apply rounded-[3px] border border-bv-linea bg-bv-panel p-5 shadow-sm;
}

/* --- Botones -------------------------------------------------------- */
.btn,
.btn-primario,
.btn-secundario,
.btn-peligro {
  @apply inline-flex items-center justify-center gap-2 rounded-[2px] px-4 py-2 text-sm font-medium transition disabled:opacity-50;
}

.btn-primario {
  @apply bg-bv-azul text-white hover:bg-bv-azul-oscuro;
}

.btn-secundario {
  @apply border border-bv-linea bg-white text-bv-texto hover:border-bv-azul hover:text-bv-azul;
}

.btn-peligro {
  @apply border border-bv-linea bg-white text-bv-texto-2 hover:border-red-400 hover:text-red-600;
}

/* --- Formularios ---------------------------------------------------- */
.campo,
.campo-claro {
  @apply w-full rounded-[2px] border border-bv-linea bg-white px-3 py-2 text-sm text-bv-texto outline-none placeholder:text-bv-texto-2/60 focus:border-bv-azul focus:ring-2 focus:ring-bv-azul/20;
}

.etiqueta {
  @apply mb-1 block text-[11px] font-medium uppercase tracking-[0.14em] text-bv-texto-2;
}

/* --- Tablas --------------------------------------------------------- */
.tabla {
  @apply w-full border-collapse text-sm;
}

.tabla th {
  @apply border-b border-bv-linea px-3 py-2 text-left text-[11px] font-medium uppercase tracking-[0.14em] text-bv-texto-2;
}

.tabla td {
  @apply border-b border-bv-linea/70 px-3 py-2 text-bv-texto;
}

.tabla tbody tr:hover td {
  @apply bg-bv-tinta;
}

/* --- Accesibilidad -------------------------------------------------- */
:focus-visible {
  outline: 2px solid var(--bv-azul);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

/* =====================================================================
   Módulo Quiebra — tablero
   ===================================================================== */

/* =====================================================================
   EL COLOR DE CADA MÓDULO EN LA PORTADA
   =====================================================================
   Las tarjetas de la portada llevan el color de su módulo. En el tema
   oficial es el del registro; en los demás se recalcula DENTRO de la
   familia del tema, para que la portada se vea de una pieza sin que los
   módulos se confundan entre ellos.

   CADA COLOR VA EN SU PUNTO MÁS SATURADO, no en una claridad fija. El
   primer intento los metió en una banda estrecha con el croma tope en
   0,12 y salieron muertos: salmón, ocre y oliva. El croma máximo que
   aguanta sRGB depende del tono Y de la claridad, así que forzar la
   claridad mata el color. Ahora se busca la cresta —dónde ese tono da
   más croma— y se toma el 93% de ella.

   Los tonos cálidos tienen su cresta entre 0,63 y 0,86 de claridad y
   ahí se ven vivos: rojo, naranja, ámbar, lima. Los fríos la tienen en
   0,88-0,90, que ya es neón de resaltador; a esos se les pone techo y
   se les reparte la claridad a mano, o dos vecinos salen iguales.

   Cada color va con la flecha que se lee encima —la de más contraste de
   las dos—, y todas pasan 3:1, que es el mínimo para un dibujo.

   Un módulo nuevo que nadie haya pintado aquí se queda con el color de
   su registro: se ve fuera de tono, no invisible. La portada usa
   var(--c-mod-<id>, <el del registro>).
   --------------------------------------------------------------------- */

[data-tema="tinta"] {
  --c-mod-quiebra: #f72735;      --c-mod-quiebra-txt: #04203f;
  --c-mod-sider: #f97d25;        --c-mod-sider-txt: #04203f;
  --c-mod-admin: #fcc231;        --c-mod-admin-txt: #04203f;
  --c-mod-inventario: #c6df32;   --c-mod-inventario-txt: #04203f;
}
[data-tema="pizarra"] {
  --c-mod-quiebra: #2fd173;      --c-mod-quiebra-txt: #0b2e33;
  --c-mod-sider: #29b499;        --c-mod-sider-txt: #0b2e33;
  --c-mod-admin: #229aa0;        --c-mod-admin-txt: #0b2e33;
  --c-mod-inventario: #1b80a1;   --c-mod-inventario-txt: #fff;
}
[data-tema="ambar"] {
  --c-mod-quiebra: #f72735;      --c-mod-quiebra-txt: #fff;
  --c-mod-sider: #f97d25;        --c-mod-sider-txt: #23262c;
  --c-mod-admin: #fcc231;        --c-mod-admin-txt: #23262c;
  --c-mod-inventario: #c6df32;   --c-mod-inventario-txt: #23262c;
}
/* Negro, gris y halo tienen DOS colores y nada más: tu #FFC000 y tu
   #FF0000. En vez de traerles verdes y azules de otro mundo, los cuatro
   módulos se reparten la rampa entre esos dos. Siguen distinguiéndose
   uno de otro y ninguno se sale del tema. */
[data-tema="negro"], [data-tema="gris"], [data-tema="halo"] {
  --c-mod-quiebra: #ff0000;      --c-mod-quiebra-txt: #fff;
  --c-mod-sider: #ff6a00;        --c-mod-sider-txt: #fff;
  --c-mod-admin: #ff9800;        --c-mod-admin-txt: #171717;
  --c-mod-inventario: #ffc000;   --c-mod-inventario-txt: #171717;
}
/* Negro, gris y halo tienen DOS colores y nada más: tu #FFC000 y tu
   #FF0000. En vez de traerles verdes y azules de otro mundo, los cuatro
   módulos se reparten la rampa entre esos dos. Siguen distinguiéndose
   uno de otro y ninguno se sale del tema. */
[data-tema="negro"], [data-tema="gris"], [data-tema="halo"] {
  --c-mod-quiebra: #ff0000;      --c-mod-quiebra-txt: #fff;
  --c-mod-sider: #ff6a00;        --c-mod-sider-txt: #fff;
  --c-mod-admin: #ff9800;        --c-mod-admin-txt: #171717;
  --c-mod-inventario: #ffc000;   --c-mod-inventario-txt: #171717;
}

/* =====================================================================
   LA TRAMA DE LA BARRA, POR TEMA
   =====================================================================
   La barra oscura es lo primero que se ve al entrar, así que cada tema
   la viste distinto. Se declaran aquí y no en shell.css porque son
   decisiones DEL TEMA, no del cascarón: shell.css solo las dibuja.

   OJO CON EL SELECTOR: va .sh[data-tema=...] y no [data-tema=...] a
   secas. shell.css declara estas mismas variables en .sh, y .sh y
   [data-tema] tienen LA MISMA especificidad: gana la que cargue de
   última, y ese orden lo decide el empaquetador y cambia entre builds.
   Con .sh delante la del tema pesa más siempre. Se probó: sin esto,
   pizarra y ámbar salían con los rombos del tema oficial.
   --------------------------------------------------------------------- */

/* Tinta y ámbar — el mismo azul marino, con rayas verticales que se
   desvanecen hacia arriba y el filo en ámbar. */
.sh[data-tema="tinta"] {
  --sh-trama: repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 1px, transparent 1px 9px);
  --sh-trama-op: .55;
  --sh-trama-tapa: linear-gradient(180deg, transparent 0%, #000 100%);
  --sh-barra-fondo:
    radial-gradient(600px 200px at 12% 130%, rgba(240,180,41,.20) 0%, transparent 72%),
    radial-gradient(700px 240px at 90% -30%, rgba(11,78,162,.45) 0%, transparent 72%),
    var(--c-04203f);
}

/* Pizarra y turquesa — los dos resplandores y el filo en degradado, tal
   como lo mandaste. */
.sh[data-tema="pizarra"] {
  --sh-trama: repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 1px, transparent 1px 9px);
  --sh-trama-op: .5;
  --sh-trama-tapa: linear-gradient(180deg, transparent 0%, #000 100%);
  --sh-barra-fondo:
    radial-gradient(560px 190px at 14% 130%, rgba(18,164,160,.55) 0%, transparent 72%),
    radial-gradient(680px 230px at 88% -30%, rgba(14,116,144,.55) 0%, transparent 72%),
    #051417;
  --sh-filo: linear-gradient(90deg,
    rgba(18,164,160,0) 0%, #12A4A0 30%, #0E7490 70%, rgba(14,116,144,0) 100%);
}

/* Ámbar sobre blanco — la textura 1: los dos resplandores, sin rayas.
   El grafito es casi negro y una trama de líneas encima lo ensucia; los
   resplandores en cambio le dan hondura sin dibujarle nada. Los alfas
   van mucho más bajos que en pizarra (.26 y .14 contra .55) porque el
   ámbar sobre grafito pesa más que el turquesa sobre pizarra: con .55
   el resplandor se comía la barra, y con el ocre a .40 el lado derecho
   salía verdoso y sucio. */
.sh[data-tema="ambar"] {
  --sh-trama: none;
  --sh-trama-op: 0;
  --sh-barra-fondo:
    radial-gradient(560px 190px at 14% 130%, rgba(255,192,0,.26) 0%, transparent 72%),
    radial-gradient(680px 230px at 92% -34%, rgba(255,192,0,.14) 0%, transparent 66%),
    #1B1D22;
}

/* 1 · Negro y ámbar — negro plano y rayas diagonales muy finas en ámbar,
   con el filo en ámbar. Tal cual el mockup. */
.sh[data-tema="negro"] {
  --sh-barra-fondo: #0D0D0D;
  --sh-filo: #FFC000;
  --sh-trama: repeating-linear-gradient(116deg, rgba(255,192,0,.10) 0 2px, transparent 2px 18px);
  --sh-trama-op: .35;
  --sh-trama-tapa: none;
}

/* 2 · Gris claro y ámbar — LA ÚNICA BARRA CLARA de la plataforma, y por
   eso el tema que más piezas mueve: el texto de la barra estaba en
   blanco en duro y sobre #D9D9D9 no se veía. Las variables --sh-barra-*
   existen para esto y su valor por defecto es el blanco de siempre, así
   que ningún otro tema cambia.
   El riel de la izquierda SIGUE oscuro, como en tu mockup: se aclara la
   barra, no la navegación. */
.sh[data-tema="gris"] {
  --sh-barra-fondo: #D9D9D9;
  --sh-barra-borde: 1px solid #C4C4C4;
  --sh-filo: #FFC000;
  --sh-filo-alto: 4px;
  --sh-trama: radial-gradient(rgba(0,0,0,.10) 1.1px, transparent 1.2px);
  --sh-trama-medida: 16px 16px;
  --sh-trama-op: .5;
  --sh-trama-tapa: none;

  --sh-barra-txt:   #141414;
  /* Tus dos grises de texto bajan un paso cada uno. Es el único sitio
     donde este tema no va literal al mockup, y es porque medido no se
     leía: tu #7A7A7A sobre #D9D9D9 da 3,04:1 en un texto de 13,5px, y
     el mínimo para leer es 4,5:1. #5E5E5E da 4,59 y #4F4F4F da 5,80.
     Se bajaron LOS DOS para no perder la jerarquía que tenías: el
     "CONTROL" sigue más claro que la hoja de la ruta. */
  --sh-barra-txt-2: #4F4F4F;
  --sh-barra-wm:    #5E5E5E;
  --sh-barra-sep:   #7A7A7A;
  --sh-barra-filo:  #BFBFBF;
  --sh-avatar-filo: #D9D9D9;
}

/* 3 · Negro con halo ámbar y rojo — negro puro con los dos resplandores,
   sin trama, y el filo en degradado de rojo a ámbar. */
.sh[data-tema="halo"] {
  --sh-barra-fondo:
    radial-gradient(520px 190px at 12% 130%, rgba(255,0,0,.30) 0%, transparent 70%),
    radial-gradient(700px 240px at 88% -30%, rgba(255,192,0,.35) 0%, transparent 72%),
    #000000;
  --sh-filo: linear-gradient(90deg, #FF0000 0%, #FFC000 100%);
  --sh-trama: none;
  --sh-trama-op: 0;
}

/* =====================================================================
   LA PANTALLA DE ENTRADA, POR TEMA
   =====================================================================
   El login no sabe quién va a entrar, así que se pinta con el tema de la
   última persona que entró EN ESE EQUIPO. Lo recuerda el navegador, no
   la base: es una preferencia del equipo, no un dato de nadie.

   Casi todo sale solo, porque acceso.css lee --c-marca y los neutros del
   tema. Lo único aparte es el campo oscuro de la izquierda: ahí va el
   discurso de la marca y necesita ser MÁS CLARO que la barra de la app,
   que es casi negra. Si reusara la tinta del tema, en negro y en halo el
   discurso quedaría sobre un fondo plano sin relieve.
   --------------------------------------------------------------------- */
/* OJO CON EL SELECTOR: va .acc[data-tema=...] y no [data-tema=...] a
   secas, por lo mismo que las barras van con .sh delante. acceso.css
   declara --acc-izq-fondo en .acc, y .acc y [data-tema] tienen LA MISMA
   especificidad: gana la que cargue de última, y ese orden lo decide el
   empaquetador. Medido: sin el .acc, los tres temas salían con la tinta
   de la barra en vez del grafito. */
.acc[data-tema="negro"] {
  --acc-izq-fondo: #1F1F1F;
  --acc-izq-halo:  #3A3A3A;
}
/* Grafito, tal cual tu mockup del login. */
.acc[data-tema="gris"] {
  --acc-izq-fondo: #262626;
  --acc-izq-halo:  #3A3A3A;
}
.acc[data-tema="halo"] {
  --acc-izq-fondo: #171717;
  --acc-izq-halo:  #4A2A00;
}

/* =====================================================================
   CONFIRMAR — el reemplazo de window.confirm()
   =====================================================================
   Vive en globals.css y no en la hoja de un módulo porque lo usan
   Roles, Maestro, Quiebra y Sider: una copia por módulo son cuatro
   sitios donde se desincroniza.
   Se viste con los tokens del tema, así que los siete lo pintan solos.
   ===================================================================== */
.cf-velo {
  position: fixed; inset: 0; z-index: 90;
  background: var(--c-velo);
  display: grid; place-items: center; padding: 20px;
  overflow-y: auto;
  animation: cf-entra .12s ease-out;
}
@keyframes cf-entra { from { opacity: 0 } to { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .cf-velo { animation: none } }

.cf-caja {
  width: 100%; max-width: 440px;
  background: #fff;
  border-radius: 0;
  /* El filo de arriba dice de qué se trata antes de leer: el acento del
     tema para lo normal, rojo para lo que destruye. */
  border-top: 4px solid var(--c-marca);
  padding: 24px 26px 20px;
  box-shadow: 0 24px 60px rgba(4, 32, 63, .32);
  font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  color: var(--c-04203f);
}
.cf-caja.peligro { border-top-color: #E4002B }

.cf-caja h2 {
  margin: 0; font-family: "Archivo", system-ui, sans-serif;
  font-weight: 800; font-size: 19px; line-height: 1.25; letter-spacing: -.01em;
  text-wrap: balance;
}
.cf-dice {
  margin: 10px 0 0; font-size: 13.5px; line-height: 1.55; color: var(--c-2c4361);
}
.cf-dice b { font-weight: 600 }

.cf-botones {
  display: flex; justify-content: flex-end; gap: 10px;
  margin-top: 20px; flex-wrap: wrap;
}
/* 44 PX Y NO 42. Este cuadro sale en el muelle, con guante, y 42 era un
   número heredado que nunca se midió: el arnés del cuadro de escribir lo
   destapó y vale para los dos, porque comparten botones. */
.cf-btn {
  min-height: 44px; padding: 0 20px; border: 0; border-radius: 2px; cursor: pointer;
  font-family: "Archivo", system-ui, sans-serif; font-weight: 800; font-size: 14px;
  background: var(--c-marca); color: var(--c-marca-txt);
}
.cf-btn:hover { background: var(--c-marca-vivo) }
.cf-btn.mal { background: #E4002B; color: #fff }
.cf-btn.mal:hover { background: #B8001F }
.cf-btn.plano {
  background: none; color: var(--c-5b6b7f);
  border: 1px solid var(--c-d5dce5); font-weight: 600;
}
.cf-btn.plano:hover { background: var(--c-f7f9fc); color: var(--c-04203f) }
.cf-btn:focus-visible { outline: 3px solid var(--c-04203f); outline-offset: 2px }

/* ---------------------------------------------------------------------
   EL CAMPO DEL CUADRO QUE PIDE ESCRIBIR (usePedirTexto)

   Comparte la caja, el velo y los botones con el de confirmar: son el
   mismo cuadro y tienen que verse igual. Lo único suyo es el campo.
   Vive aquí por lo mismo que el otro — lo usan Roturas, Averías y
   Salida, y una copia por módulo son tres sitios donde se desincroniza.
   ------------------------------------------------------------------ */
.pt-campo { display: block; margin-top: 16px }
.pt-campo > span {
  display: block; font: 700 10.5px "Archivo", system-ui, sans-serif;
  letter-spacing: .12em; text-transform: uppercase; color: var(--c-5b6b7f);
  margin-bottom: 6px;
}
.pt-campo > span b { color: var(--c-04203f); letter-spacing: 0; font-size: 12px }
.pt-campo input, .pt-campo textarea {
  /* `border-box` NO ES DECORACIÓN AQUÍ. Con el `content-box` que traía
     por defecto, el 100 % es el ANCHO DEL TEXTO y el relleno y el borde
     se suman encima: a 390 px el campo se salía de la caja del cuadro
     por 26 px. En el PC no se nota. */
  box-sizing: border-box;
  width: 100%; min-height: 44px;   /* con guante */
  padding: 10px 12px; border-radius: 2px;
  border: 1px solid var(--c-d5dce5); background: #fff; color: var(--c-04203f);
  font: 400 15px "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  line-height: 1.45; resize: vertical;
}
.pt-campo input:focus-visible, .pt-campo textarea:focus-visible {
  outline: 3px solid var(--c-04203f); outline-offset: 1px; border-color: var(--c-04203f);
}
.pt-copia { margin-top: 12px }
/* EL BOTÓN APAGADO SIGUE LEYÉNDOSE: es el que dice qué falta, así que
   bajarle la opacidad hasta que no se lea lo deja mudo otra vez. */
.cf-btn:disabled { opacity: 1; background: var(--c-eef1f5); color: var(--c-5b6b7f); cursor: not-allowed }
.cf-btn.mal:disabled { background: var(--c-eef1f5); color: var(--c-5b6b7f) }

@media (max-width: 480px) {
  .cf-caja { padding: 20px 18px 18px }
  .cf-botones { flex-direction: column-reverse }
  .cf-btn { width: 100% }
}

/* ---------- El celular respira ----------
   Generado desde la auditoría de densidad y comprobado midiendo: la
   letra sube al suelo de lectura y los botones al blanco que pide un
   dedo. Solo aplica en pantalla chica; en escritorio no cambia nada. */
@media (max-width: 700px) {
  /* Letra que no se leía */
  .banda .eyebrow { font-size: 11.5px }
  .ht { font-size: 11.5px }
  .hmeta { font-size: 12px }
  .hbadge { font-size: 12px }
  .ct { font-size: 11.5px }
  .cn { font-size: 12px }
  .leyenda { font-size: 12px }
  .eje { font-size: 12px }
  .dato { font-size: 12px }
  .cod { font-size: 12px }
  .pie { font-size: 12px }
}

/* =====================================================================
   AVISOS — lo que la aplicación contesta cuando algo pasa.

   Viven en globals.css y no en el CSS de un módulo por la misma razón
   que el diálogo de confirmar: los usan todos los módulos y los visten
   los siete temas sin que haya que repetir la regla siete veces.

   Abajo a la derecha en PC; ARRIBA en celular, porque abajo los tapa el
   teclado y la barra de navegación del módulo.
   ===================================================================== */
.av-pila {
  position: fixed; right: 18px; bottom: 18px; z-index: 90;
  display: flex; flex-direction: column; gap: 9px;
  width: min(420px, calc(100vw - 36px));
  pointer-events: none;
}

.av {
  pointer-events: auto;
  display: grid; grid-template-columns: 22px minmax(0, 1fr) 26px;
  gap: 11px; align-items: start;
  background: var(--bv-panel); color: var(--bv-texto);
  border: 1px solid var(--bv-linea); border-left: 3px solid var(--bv-linea);
  border-radius: 3px; padding: 12px 13px;
  box-shadow: var(--sombra-suave);
  font-size: 13px; line-height: 1.45;
  /* Entra desde abajo y no aparece de golpe: un cartel que se
     materializa se lee como un error del navegador, uno que entra se
     lee como una respuesta de la aplicación. */
  animation: av-entra .18s ease-out;
}
@keyframes av-entra {
  from { opacity: 0; transform: translateY(8px) }
  to   { opacity: 1; transform: none }
}
@media (prefers-reduced-motion: reduce) { .av { animation: none } }

.av .av-icono svg {
  width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9;
  stroke-linecap: round; stroke-linejoin: round; display: block; margin-top: 1px;
}
.av .av-txt { min-width: 0; overflow-wrap: anywhere }
.av .av-x {
  font: inherit; font-size: 15px; line-height: 1; background: transparent; border: 0;
  color: var(--bv-texto-2); cursor: pointer; padding: 2px 4px; border-radius: 3px;
  /* 26 px de ancho de caja pero blanco de toque de 38: el área táctil se
     estira con el padding sin empujar el texto de al lado. */
  min-height: 26px;
}
.av .av-x:hover { background: var(--c-eef1f5); color: var(--bv-texto) }

.av.bien { border-left-color: #0F7A4A }
.av.bien .av-icono { color: #0F7A4A }
.av.mal  { border-left-color: #E4002B; background: #FEF4F6 }
.av.mal  .av-icono { color: #E4002B }
.av.info { border-left-color: var(--c-oro) }
.av.info .av-icono { color: #8A5A00 }

@media (max-width: 760px) {
  .av-pila {
    right: 12px; left: 12px; width: auto;
    top: calc(10px + env(safe-area-inset-top)); bottom: auto;
  }
  @keyframes av-entra {
    from { opacity: 0; transform: translateY(-8px) }
    to   { opacity: 1; transform: none }
  }
}


/* =====================================================================
   LA LISTA DEL MAESTRO (componente src/components/MaestroLista.tsx)

   VIVE AQUÍ Y NO EN LA HOJA DE UN MÓDULO porque la usan Traspasos y
   Roturas. Una copia por módulo son dos sitios donde se desincroniza:
   se arregla el menú que se salía en una y no en la otra, y nadie se
   entera hasta que alguien lo ve.

   Se viste con los tokens neutrales —los `--c-*` que ya comparten
   todos los módulos— así que los siete temas la pintan solos.

   BORDES RECTOS: 3 px y no 14. «Los bordes más rectangulares porque
   todo está así» — y era verdad: lo redondo venía de la plantilla con
   la que nació el repositorio.
   ===================================================================== */
.ml-caja, .ml-agregar, .ml-item, .ml-sw, .ml-mas {
  --c-papel-m: #fff;
  --c-mal-m: #C8102E;
  --ml-titulo: "Archivo", system-ui, sans-serif;
  --ml-texto: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
}
.ml-caja {
  background: var(--c-papel-m); border: 1px solid var(--c-d5dce5);
  border-radius: 0; min-width: 0;
}
.ml-caja > .item:last-child { border-radius: 0}
.ml-caja .ml-cab { padding: 16px 18px 13px; border-bottom: 1px solid var(--c-d5dce5) }
.ml-caja h2 {
  font-family: var(--ml-titulo); font-weight: 800; font-size: 17px; margin: 0;
  letter-spacing: -.02em; display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
}
/* EL CONTADOR DEL TÍTULO: gris sobre gris claro daba 4,39 en el tema
   ámbar —por debajo del piso de 4,5— y en los otros seis pasaba raspando.
   Va en tinta: es un número, y un número que hay que adivinar no sirve
   de nada. */
.ml-caja h2 em {
  font-style: normal; background: var(--c-eef1f5); color: var(--c-04203f);
  font-family: var(--ml-texto); font-weight: 600; font-size: 12px;
  padding: 3px 8px; border-radius: 0;
}
.ml-caja .ml-cab p { margin: 6px 0 0; font-size: 12.5px; color: var(--c-5b6b7f); line-height: 1.5 }

/* La franja de "escritos a mano" y sus chips vivían aquí. Se fueron con
   la pantalla: Registrar ya escoge del maestro, así que por ahí no entra
   ningún sitio nuevo y la franja solo podía mostrar restos viejos. Se
   borran las reglas en vez de dejarlas apagadas — el CSS muerto es lo
   que el mes que viene alguien "arregla" sin saber para qué era. */

/* ---------- Agregar ---------- */
.ml-agregar {
  display: flex; gap: 9px; padding: 14px 18px; border-bottom: 1px solid var(--c-d5dce5);
}
.ml-agregar input {
  font: inherit; font-size: 16px; flex: 1 1 140px; min-width: 0; min-height: 46px;
  border: 1.5px solid var(--c-d5dce5); border-radius: 0; padding: 0 13px;
  background: var(--c-eef1f5); color: var(--c-04203f);
}
.ml-agregar input:focus {
  outline: none; background: var(--c-papel-m); border-color: var(--c-marca);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-marca) 25%, transparent);
}
.ml-agregar button {
  min-height: 46px; padding: 0 18px; border: 0; border-radius: 0; cursor: pointer;
  /* `--c-grupo-txt` NO EXISTE en ningún tema: lo encontré buscando por
     qué la lista del buscador salía transparente, y es el mismo error.
     Sin el respaldo, el texto se quedaba con el color heredado encima
     del fondo del grupo — a veces legible y a veces no, según la
     pantalla. */
  background: var(--c-grupo); color: var(--c-grupo-txt, #04203f); font: 800 13px var(--ml-titulo);
  white-space: nowrap;
}
.ml-agregar button:hover:not(:disabled) { background: var(--c-marca); color: var(--c-marca-txt) }
.ml-agregar button:disabled { opacity: .45; cursor: not-allowed }

/* ---------- Un renglón del maestro ---------- */
.ml-item {
  display: grid; grid-template-columns: 20px minmax(0, 1fr) auto 38px 30px;
  gap: 10px; align-items: center; padding: 10px 18px;
  border-bottom: 1px solid var(--c-eef1f5);
}
.ml-item:last-child { border-bottom: 0 }
.ml-item > * { min-width: 0 }
.ml-item:hover { background: color-mix(in srgb, var(--c-marca) 5%, #fff) }
.ml-item.ml-moviendo {
  background: color-mix(in srgb, var(--c-marca) 16%, #fff);
  box-shadow: inset 3px 0 0 var(--c-marca);
}
.ml-item .ml-asa {
  cursor: grab; opacity: .4; display: grid; place-items: center;
  background: none; border: 0; padding: 0; min-height: 30px;
  /* Sin esto, arrastrar en el celular hace rodar la página en vez de
     mover el renglón. */
  touch-action: none;
}
.ml-item .ml-asa:hover { opacity: .9 }
.ml-item .ml-asa svg {
  width: 15px; height: 15px; stroke: var(--c-5b6b7f);
  stroke-width: 2.6; stroke-linecap: round; fill: none;
}
.ml-item .ml-nom b { display: block; font-size: 14px; font-weight: 600; overflow-wrap: anywhere }
.ml-item .ml-nom span { display: block; font-size: 11.5px; color: var(--c-5b6b7f); margin-top: 1px }
.ml-item .ml-uso {
  font-size: 12px; color: var(--c-5b6b7f); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.ml-item.ml-apagado { background: var(--c-eef1f5) }
.ml-item.ml-apagado .ml-nom b { color: var(--c-5b6b7f); text-decoration: line-through }

/* LA MARCA DE UNA BANDERA DEL TIPO —hoy «vidrio»—. Va pegada al nombre
   y no en una columna aparte: son una o dos filas de la lista las que la
   llevan, y una columna vacía en veinte filas para marcar dos es ruido
   en todas para informar en dos. */
.ml-item .ml-nom .ml-bandera {
  display: inline-block; margin-left: 7px; padding: 1px 7px; border-radius: 0;
  background: var(--c-marca); color: var(--c-marca-txt);
  font: 700 10px var(--ml-texto); font-style: normal; letter-spacing: .06em;
  text-transform: uppercase; vertical-align: 2px;
}

/* El interruptor. Es un <input> de verdad debajo: se enfoca con el
   teclado y se prende con la barra espaciadora como cualquier casilla. */
.ml-sw { position: relative; display: inline-block; width: 38px; height: 22px; cursor: pointer }
/* LA ZONA QUE SE TOCA ES MÁS ALTA QUE LA QUE SE VE. El riel mide 22 px
   —así se ve un interruptor— pero 22 px es menos de lo que acierta un
   dedo con guante en la tableta del muelle. El <input> se estira 9 px
   por arriba y por abajo: 40 px de blanco para tocar, sin cambiar el
   dibujo ni empujar el renglón. */
.ml-sw input {
  position: absolute; left: 0; top: -9px; width: 100%; height: 40px;
  opacity: 0; margin: 0; cursor: pointer;
}
.ml-sw i {
  position: absolute; inset: 0; background: color-mix(in srgb, var(--c-5b6b7f) 45%, #fff);
  border-radius: 3px; transition: background .15s; pointer-events: none;
}
.ml-sw i::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
  border-radius: 2px; background: #fff; transition: transform .15s;
}
.ml-sw input:checked + i { background: var(--c-marca) }
.ml-sw input:checked + i::after { transform: translateX(16px) }
.ml-sw input:focus-visible + i { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-marca) 40%, transparent) }
.ml-sw input:disabled { cursor: not-allowed }
.ml-sw input:disabled + i { opacity: .45 }

/* El menú de los tres puntos. */
.ml-mas { position: relative; justify-self: end }
.ml-mas > button {
  border: 0; background: none; cursor: pointer; color: var(--c-5b6b7f);
  font-size: 17px; line-height: 1; min-height: 30px; min-width: 28px; border-radius: 0;
}
.ml-mas > button:hover { color: var(--c-04203f); background: var(--c-eef1f5) }
.ml-mas .ml-menu {
  position: absolute; top: calc(100% + 4px); right: 0; z-index: 30; min-width: 190px;
  background: var(--c-papel-m); border: 1px solid var(--c-d5dce5); border-radius: 0;
  box-shadow: 0 20px 40px -22px rgba(0, 0, 0, .5); padding: 4px 0;
}
/* Abierto hacia arriba: mismo menú, al otro lado del botón. */
.ml-mas .ml-menu.ml-arriba { top: auto; bottom: calc(100% + 4px) }
/* El cuadro que se pinta para medirlo. Ocupa su sitio pero no se ve, así
   que el ojo nunca lo alcanza abajo antes de que suba. */
.ml-mas .ml-menu.ml-midiendo { visibility: hidden }
.ml-mas .ml-menu::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--c-marca);
}
.ml-mas .ml-menu button {
  display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
  font: 500 13.5px var(--ml-texto); color: var(--c-04203f); padding: 10px 13px; min-height: 40px;
}
.ml-mas .ml-menu button:first-child { margin-top: 3px }
.ml-mas .ml-menu button:hover { background: var(--c-eef1f5) }
.ml-mas .ml-menu button.ml-mal { color: var(--c-mal-m) }
.ml-mas .ml-menu button:disabled { opacity: .45; cursor: not-allowed }
.ml-mas .ml-menu .ml-nota {
  padding: 9px 13px; font-size: 11.5px; color: var(--c-5b6b7f); line-height: 1.45;
  border-top: 1px solid var(--c-eef1f5); margin-top: 3px;
}

/* =====================================================================
   BUSCAR EN UNA LISTA LARGA · prefijo `bl-`
   ---------------------------------------------------------------------
   Comprobado libre en globals.css, shell.css, roturas.css y averias.css.

   VIVE AQUÍ Y NO EN UN MÓDULO porque lo usan dos —Roturas y Averías— y
   una copia por módulo son dos sitios donde se desincronizan. Es la
   misma razón por la que `ml-` está arriba.

   LOS TOKENS SE DECLARAN AQUÍ, Y ESO NO ES ADORNO.
   La primera versión de este bloque tomó `--c-papel-m` del bloque de
   `ml-` sin mirar dónde estaba declarado: es una variable LOCAL de
   `.ml-caja`, no un token de tema. Fuera de ese selector no resuelve, y
   `background: var(--c-papel-m)` se quedó en TRANSPARENTE — la lista de
   materiales salió encima del formulario dejando ver los botones y el
   contador atravesados con el texto. Se veía rota.

   Mismo error con `--c-grupo-txt`, que directamente no existe en
   ninguna parte.

   La regla que queda: un componente compartido declara sus propios
   colores o usa tokens que estén en LOS SIETE TEMAS. No hereda
   variables de otro componente.

   NO DEPENDE TAMPOCO DE `campo-suelto` NI DE `--rt-oro`: el primero
   solo existe dentro de `.rt-rep` y `.tp`, y el segundo es el ROJO de
   la marca en tres temas.
   ===================================================================== */
.bl {
  position: relative;
  /* EL PAPEL ES BLANCO FIJO, igual que en `ml-`: es el mismo papel de
     las tarjetas del resto de la plataforma y los siete temas ya lo
     pintan así. */
  --bl-papel: #ffffff;
  /* LA TINTA TAMBIÉN VA FIJA, y por la misma razón que el papel: si el
     papel no cambia con el tema, el texto encima tampoco puede. Con el
     gris del tema, en ámbar el código de la estiba contrastaba 4.39
     —por debajo del piso de 4.5— sobre un papel que era blanco igual
     en los siete. Medido, no supuesto. */
  --bl-tinta: #04203f;
  --bl-gris:  #52627a;
  --bl-linea: #d5dce5;
  --bl-suave: #eef1f5;
}

.bl-campo {
  width: 100%; min-height: 50px; padding: 0 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  border: 1.5px solid var(--bl-linea); border-radius: 0; cursor: pointer;
  font: 500 15px inherit; text-align: left;
  background: var(--bl-suave); color: var(--bl-gris);
}
/* CON ALGO PUESTO SE VE PUESTO: en tinta y en negrita. Un campo lleno
   que se ve igual que uno vacío se vuelve a llenar. */
.bl-campo.on { color: var(--bl-tinta); font-weight: 600 }
.bl-campo > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.bl-campo > i { font-style: normal; flex: none; color: var(--bl-gris) }
.bl-teclea {
  display: block; background: var(--bl-papel); color: var(--bl-tinta);
  border-color: var(--c-marca, #e4002b); outline: none;
}

/* LA LISTA VA ENCIMA DEL FORMULARIO: tiene que ser OPACA y estar por
   encima de todo lo que hay debajo. Sin fondo, el texto de las opciones
   se mezcla con los botones y el contador de unidades y no se lee
   ninguno de los dos. */
.bl-lista {
  position: absolute; z-index: 60; left: 0; right: 0; top: calc(100% + 4px);
  max-height: 320px; overflow-y: auto;
  background: var(--bl-papel);
  border: 1.5px solid var(--bl-linea); border-radius: 0;
  box-shadow: 0 12px 28px rgba(0, 0, 0, .22);
}
.bl-op {
  display: flex; flex-direction: column; gap: 1px; width: 100%; text-align: left;
  /* 48 px: se escoge de pie y con guante, igual que todo lo demás. */
  min-height: 48px; padding: 8px 13px; border: 0; cursor: pointer;
  background: var(--bl-papel);
  border-bottom: 1px solid var(--bl-linea);
}
.bl-op b { font: 600 14px inherit; color: var(--bl-tinta); line-height: 1.3 }
/* EL CUADRITO DE COLOR, cuando la opción lo trae. Cuadrado y no
   redondo, igual que el de los botones del tipo de vidrio: es el mismo
   dato y tiene que verse igual en los dos sitios. El borde fino existe
   porque el flint es casi blanco y sobre papel blanco no se vería. */
.bl-op b .bl-color {
  display: inline-block; width: 11px; height: 11px; flex: none;
  margin-right: 8px; vertical-align: -1px;
  border: 1px solid rgba(0, 0, 0, .22);
}
.bl-op span {
  font: 500 11.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color: var(--bl-gris);
}
.bl-op.marcado { background: var(--bl-suave) }
/* LA ESCOGIDA, CON UN FILO Y NO CON UN FONDO DE COLOR: el fondo detrás
   del código de la estiba lo vuelve más difícil de leer, y el código es
   lo que está pegado en el material. */
.bl-op.puesto {
  background: var(--bl-suave);
  box-shadow: inset 3px 0 0 0 var(--c-marca, #e4002b);
}
.bl-nada {
  padding: 14px; margin: 0;
  background: var(--bl-papel);
  font-size: 12.5px; line-height: 1.5; color: var(--bl-gris);
}
/* ---------------------------------------------------------------------
   Cascarón de la app: barra superior oscura y portada de módulos.
   Prefijo .sh- para no chocar con nada del resto de la aplicación.
   --------------------------------------------------------------------- */

.sh {
  /* Aire extra arriba de la barra. En escritorio no hace falta; en el
     celular sí, porque el área segura del sistema vale 0 en Safari y la
     barra queda pegada al borde de la pantalla: se lee como si estuviera
     cruzada con el reloj. */
  --sh-aire: 0px;

  --sh-tinta:     var(--c-04203f);
  --sh-azul:      var(--c-0b4ea2);
  --sh-rojo:      var(--c-marca);
  --sh-hueso:     var(--c-eef1f5);
  --sh-papel:     #FFFFFF;
  --sh-gris:      var(--c-5b6b7f);
  --sh-linea:     var(--c-d5dce5);

  /* ---- La barra oscura, por piezas, para que cada tema la vista ----
     El fondo, el filo de abajo y la trama son variables porque cada
     tema los quiere distintos: el oficial lleva rombos, pizarra lleva
     resplandores y rayas verticales, ámbar va lisa. Si estuvieran en
     duro, un tema nuevo obligaría a repetir toda la regla. */
  --sh-barra-fondo: var(--sh-tinta);
  --sh-filo:        var(--sh-rojo);
  --sh-trama:
    repeating-linear-gradient(64deg,  rgba(255,255,255,.50) 0 1px, transparent 1px 74px),
    repeating-linear-gradient(-64deg, rgba(255,255,255,.28) 0 1px, transparent 1px 74px);
  --sh-trama-op:   .3;
  --sh-trama-tapa: linear-gradient(90deg, transparent 0%, #000 22%, #000 68%, transparent 92%);
  --sh-trama-medida: auto;
  --sh-filo-alto:  3px;
  --sh-barra-borde: 0 solid transparent;

  /* ---- El texto de la barra ----
     Estaba en blanco en duro porque la barra siempre había sido oscura.
     El tema "gris" la lleva CLARA, y sobre #D9D9D9 el blanco no se ve.
     El valor por defecto es el blanco de siempre, así que los cuatro
     temas que ya existían no cambian ni un pixel. */
  --sh-barra-txt:   #ffffff;
  --sh-barra-txt-2: var(--c-a9c2de);
  --sh-barra-wm:    var(--c-7e97b5);
  --sh-barra-sep:   rgba(255,255,255,.4);
  --sh-barra-filo:  rgba(255,255,255,.08);
  --sh-avatar-filo: rgba(255,255,255,.9);

  --sh-titulo: "Archivo", system-ui, sans-serif;
  --sh-texto:  "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* ====================== Barra superior ====================== */
.sh-barra {
  position: relative;
  flex: none;
  /* Instalada en el celular, la app corre a pantalla completa y el azul se
     mete debajo del reloj y la batería. El área segura del sistema se suma
     como relleno para que el contenido de la barra empiece abajo de ellos.
     El azul sí llega hasta el borde, para que no quede una franja clara. */
  height: calc(70px + var(--sh-aire) + env(safe-area-inset-top));
  padding-top: calc(var(--sh-aire) + env(safe-area-inset-top));
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 0 30px 0 0;
  background: var(--sh-barra-fondo);
  border-bottom: var(--sh-barra-borde);
  color: var(--sh-barra-txt);
  font-family: var(--sh-texto);
}
/* filo rojo: el mismo gesto del acceso */
.sh-barra::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: var(--sh-filo-alto);
  background: var(--sh-filo);
}
/* La trama. Cuál es la pone el tema; aquí solo se dibuja. */
.sh-barra::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: var(--sh-trama-op);
  pointer-events: none;
  background-image: var(--sh-trama);
  background-size: var(--sh-trama-medida);
  -webkit-mask-image: var(--sh-trama-tapa);
  mask-image: var(--sh-trama-tapa);
}
.sh-barra > * { position: relative }

/* El logo ocupa 64px, lo mismo que el riel: la columna de la izquierda se
   lee como una sola pieza de arriba a abajo. */
.sh-barra .esquina {
  width: 64px; height: 100%;
  display: grid; place-items: center; flex: none;
  border-right: 1px solid var(--sh-barra-filo);
}
.sh-barra .esquina img { width: 36px; height: 36px; display: block }

.sh-barra .ruta { display: flex; align-items: center; gap: 10px; font-size: 14px; min-width: 0 }
.sh-barra .ruta .wm {
  font-family: var(--sh-titulo); font-weight: 800; font-size: 13.5px;
  letter-spacing: .2em; color: var(--sh-barra-wm); white-space: nowrap;
}
.sh-barra .ruta .modulo {
  font-family: var(--sh-titulo); font-weight: 800; letter-spacing: .02em;
  color: var(--sh-barra-txt); white-space: nowrap;
}
.sh-barra .ruta .hoja { color: var(--sh-barra-txt-2); font-weight: 500; white-space: nowrap }
.sh-barra .ruta .sep { width: 14px; height: 14px; stroke: var(--sh-barra-sep); fill: none; flex: none }
/* Cada nivel de las migas se abre: CONTROL › Módulo › Rama › (Grupo), con un menú de lo que hay ahí. */
.sh-barra .ruta { z-index: 30 }
.sh-barra .ruta-cel { display: none }
.sh-barra .ruta-nivel { display: inline-flex; align-items: center; gap: 10px; min-width: 0 }
.sh-barra .ruta-caja { position: relative; display: inline-flex }
.sh-barra .ruta-bt { display: inline-flex; align-items: center; gap: 4px; padding: 6px 6px; margin: 0 -6px; border: 0; border-radius: 4px;
  background: none; cursor: pointer; font: inherit; color: inherit; white-space: nowrap }
.sh-barra .ruta-bt.wm { font-family: var(--sh-titulo); font-weight: 800; font-size: 13.5px; letter-spacing: .2em; color: var(--sh-barra-wm) }
.sh-barra .ruta-bt.modulo { font-family: var(--sh-titulo); font-weight: 800; letter-spacing: .02em; color: var(--sh-barra-txt) }
.sh-barra .ruta-bt.rama { font-weight: 600; color: var(--sh-barra-txt) }
.sh-barra .ruta-bt:hover, .sh-barra .ruta-bt[aria-expanded="true"] { background: color-mix(in srgb, currentColor 12%, transparent) }
.sh-barra .ruta-bt:focus-visible { outline: 2px solid var(--sh-filo); outline-offset: 1px }
.sh-barra .ruta-bt:disabled { cursor: default; background: none }
.sh-barra .ruta-v { width: 14px; height: 14px; stroke: currentColor; opacity: .55; flex: none }
.sh-barra .ruta-menu { position: absolute; top: calc(100% + 8px); left: -6px; z-index: 60; min-width: 220px; max-height: min(70vh, 460px); overflow: auto;
  display: flex; flex-direction: column; padding: 6px; background: var(--sh-papel); color: var(--sh-tinta);
  border: 1px solid var(--sh-linea); border-radius: 6px; box-shadow: 0 12px 32px rgba(4, 32, 63, .18) }
.sh-barra .ruta-op { display: block; padding: 9px 12px; border-radius: 4px; color: var(--sh-tinta); text-decoration: none;
  font: 500 14px var(--sh-texto); letter-spacing: 0; white-space: nowrap }
.sh-barra .ruta-op:hover, .sh-barra .ruta-op:focus-visible { background: var(--sh-hueso); outline: none }
.sh-barra .ruta-op.actual { font-weight: 700; box-shadow: inset 3px 0 0 var(--sh-filo) }
.sh-barra .ruta-op.sub { padding-left: 26px }
.sh-barra .ruta-op.titulo { padding: 10px 12px 4px; font: 700 10.5px var(--sh-texto); letter-spacing: .12em; text-transform: uppercase; color: var(--sh-gris) }
.sh-barra .der {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 13.5px;
  color: var(--sh-barra-txt-2);
}
.sh-avatar {
  width: 36px; height: 36px;
  border-radius: 2px;
  background: var(--sh-rojo);
  color: var(--c-marca-txt);
  display: grid;
  place-items: center;
  font-family: var(--sh-titulo);
  font-weight: 800;
  font-size: 13px;
  letter-spacing: .04em;
  flex: none;
  /* es un enlace a Mi perfil: el borde blanco lo delata sin texto */
  text-decoration: none;
  border: 2px solid var(--sh-avatar-filo);
  transition: border-color .14s, transform .14s;
}
a.sh-avatar:hover { border-color: #fff; transform: scale(1.06) }
a.sh-avatar:focus-visible { outline: 2px solid #fff; outline-offset: 3px }

/* botones de instalar / actualizar, sobre fondo oscuro */
.sh-boton {
  display: grid;
  place-items: center;
  width: 30px; height: 30px;
  border-radius: 2px;
  border: 1px solid rgba(255,255,255,.28);
  background: transparent;
  color: var(--c-c9dcf0);
  cursor: pointer;
  flex: none;
  transition: border-color .14s, color .14s, background .14s;
}
.sh-boton:hover { border-color: rgba(255,255,255,.6); color: #fff }
.sh-boton:focus-visible { outline: 2px solid #fff; outline-offset: 2px }
.sh-boton.nuevo {
  border-color: var(--sh-rojo);
  background: var(--sh-rojo);
  color: var(--c-marca-txt);
}
.sh-gira { animation: sh-girar .9s linear infinite }
@keyframes sh-girar { to { transform: rotate(360deg) } }

/* ====================== Portada de módulos ====================== */
.sh-portada {
  font-family: var(--sh-texto);
  color: var(--sh-tinta);
  display: flex;
  flex-direction: column;
  /* la barra mide 70px; esto hace que la portada llene la pantalla */
  min-height: calc(100dvh - 70px - var(--sh-aire) - env(safe-area-inset-top));
  /* El <main> del cascarón trae relleno para las páginas de los módulos.
     La portada lo anula para poder llegar a los bordes: el filo del pie
     tiene que cruzar la pantalla completa. */
  margin: -26px -30px -40px;
  padding: 38px 30px 0;
}

.sh-titulo {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 26px;
}
.sh-titulo h1 {
  font-family: var(--sh-titulo);
  font-weight: 800;
  font-size: clamp(26px, 2.6vw, 36px);
  letter-spacing: -.03em;
  margin: 0;
  text-wrap: balance;
}
.sh-firma {
  display: flex;
  align-items: center;
  gap: 11px;
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: .055em;
  color: var(--sh-gris);
  padding-bottom: 5px;
  margin: 0;
  flex: none;
}
.sh-firma::before {
  content: "";
  width: 24px; height: 3px;
  background: var(--sh-rojo);
  flex: none;
}

.sh-mosaico {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 22px;
  /* Alto por FILA, no del grid entero.
     Antes esto decía height: min(480px, 60vh), que era el alto de TODO el
     mosaico. Con dos módulos daba lo mismo porque cabían en una fila;
     al llegar el tercero el grid se partió en dos filas, las 480px se
     repartieron, cada tarjeta quedó de 230 y el contenido se desbordó
     hacia arriba montándose sobre el rótulo. Un alto por fila crece con
     los módulos que haya. */
  grid-auto-rows: minmax(300px, auto);
  margin: auto 0;
}
/* un solo módulo no se estira a media pantalla */
.sh-mosaico.uno { grid-template-columns: minmax(0, 620px) }

.sh-modulo {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  /* El relleno de arriba le RESERVA la banda al rótulo. El rótulo va
     absoluto y el contenido centrado; si el contenido pudiera subir por
     encima de 74px se le montaría encima, y centrar no respeta nada que
     esté fuera de la caja de contenido. */
  padding: 74px 40px 40px 46px;
  background: var(--sh-papel);
  border: 1px solid var(--sh-linea);
  border-radius: 3px;
  text-decoration: none;
  color: var(--sh-tinta);
  box-shadow: 0 18px 42px -34px rgba(4,32,63,.55);
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.sh-modulo:hover {
  transform: translateY(-4px);
  border-color: var(--acento);
  box-shadow: 0 30px 56px -34px rgba(4,32,63,.6);
}
.sh-modulo:focus-visible { outline: 3px solid var(--sh-azul); outline-offset: 3px }

.sh-riel {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 5px;
  background: var(--acento);
}
.sh-cinta {
  position: absolute;
  top: 46px; right: -104px;
  width: 290px; height: 46px;
  background: var(--acento);
  transform: rotate(52deg);
  transition: top .18s ease, right .18s ease;
}
.sh-modulo:hover .sh-cinta { top: 36px; right: -94px }

.sh-codigo {
  position: absolute;
  top: 34px; left: 46px;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: .16em;
  color: var(--sh-gris);
}

.sh-modulo h2 {
  position: relative;
  font-family: var(--sh-titulo);
  font-weight: 900;
  font-size: clamp(40px, 4.4vw, 68px);
  line-height: .88;
  letter-spacing: -.045em;
  margin: 0;
}

.sh-datos {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 26px;
}
.sh-datos span {
  border: 1px solid var(--sh-linea);
  padding: 6px 12px;
  border-radius: 2px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--c-2c4361);
}

.sh-abrir {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 32px;
  font-family: var(--sh-titulo);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: .02em;
}
.sh-abrir i {
  width: 42px; height: 42px;
  border-radius: 2px;
  background: var(--acento);
  display: grid;
  place-items: center;
  flex: none;
}
.sh-abrir svg {
  width: 17px; height: 17px;
  stroke: var(--flecha, #fff);
  stroke-width: 2.4;
  fill: none;
}

/* ====================== Pie ====================== */
.sh-pie {
  flex: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin: 30px -30px 0;
  padding: 16px 30px;
  font-size: 12.5px;
  color: var(--sh-gris);
  border-top: 1px solid var(--sh-linea);
}
.sh-pie b { font-weight: 600; color: var(--c-2c4361) }
.sh-pie button {
  color: var(--sh-azul);
  font-weight: 600;
  font-family: inherit;
  font-size: 12.5px;
  background: none;
  border: 0;
  border-bottom: 1.5px solid rgba(11,78,162,.3);
  padding-bottom: 1px;
  cursor: pointer;
}
.sh-pie button:hover { color: var(--sh-rojo); border-bottom-color: var(--sh-rojo) }
.sh-pie button:focus-visible { outline: 2px solid var(--sh-azul); outline-offset: 3px }

/* ====================== Celular y tableta ====================== */
@media (max-width: 900px) {
  .sh-barra { padding: 0 18px; gap: 14px }
  .sh-barra img { width: 34px; height: 34px }
  .sh-barra .der .turno { display: none }

  .sh-portada { margin: -18px -18px -30px; padding: 26px 20px 0 }
  .sh-titulo { flex-direction: column; align-items: flex-start; gap: 10px }
  .sh-firma { padding-bottom: 0 }

  .sh-mosaico {
    grid-template-columns: 1fr;
    gap: 16px;
    height: auto;
    min-height: 0;
  }
  .sh-mosaico.uno { grid-template-columns: 1fr }

  .sh-modulo {
    justify-content: flex-start;
    padding: 26px 24px 28px 30px;
  }
  .sh-modulo h2 { font-size: clamp(38px, 10vw, 52px) }
  /* el rótulo pasa al flujo: absoluto choca con el título */
  .sh-codigo { position: static; margin-bottom: 12px }
  .sh-cinta { top: 30px; right: -118px; width: 250px; height: 44px }

  .sh-pie {
    margin: 26px -20px 0;
    padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
  }
}

@media (prefers-reduced-motion: reduce) {
  .sh-modulo, .sh-cinta, .sh-boton { transition: none !important }
  .sh-gira { animation: none !important }
}

/* ====================== Texto grande (equipos de piso) ======================
   Se activa desde Mi perfil › Preferencias. Sube el tamaño base de la app;
   como casi todo está en px no hereda solo, así que se tocan las piezas que
   de verdad se leen y se tocan con guantes: tablas, campos y botones. */
.sh[data-grande="si"] { font-size: 17px }
.sh[data-grande="si"] .tabla th,
.sh[data-grande="si"] .tabla td { font-size: 15px; padding-top: 12px; padding-bottom: 12px }
.sh[data-grande="si"] .campo,
.sh[data-grande="si"] .pf-campo input,
.sh[data-grande="si"] .pf-campo select { height: 54px; font-size: 17px }
.sh[data-grande="si"] .btn-primario,
.sh[data-grande="si"] .btn-secundario,
.sh[data-grande="si"] .pf-btn { min-height: 54px; font-size: 16px }
.sh[data-grande="si"] .etiqueta,
.sh[data-grande="si"] .pf-campo label { font-size: 15px }
.sh[data-grande="si"] .sh-datos span,
.sh[data-grande="si"] .pf-reglas li { font-size: 14px }

/* ====================== Cuerpo: riel + contenido ====================== */
.sh-marco {
  display: grid;
  grid-template-columns: 64px 1fr;
  transition: grid-template-columns .18s ease;
  flex: 1;
  min-height: 0;
}
.sh-marco.anclado { grid-template-columns: 236px 1fr }
.sh-marco.sin-riel { grid-template-columns: 1fr }
/* Sin esto, una columna 1fr no puede achicarse por debajo del contenido y
   basta con que el riel se vuelva fila de pestañas para que TODA la página
   se ensanche y aparezca el desplazamiento horizontal. */
.sh-marco > * { min-width: 0 }
.sh-cerrada { max-width: 560px; margin: 40px auto; padding: 26px 24px; background: #fff; border: 1px solid #DDE2E8; border-left: 5px solid #E9A81F; border-radius: 3px }
.sh-cerrada h1 { margin: 0 0 8px; font-size: 22px; font-weight: 800; letter-spacing: -.01em }
.sh-cerrada p { margin: 0 0 18px; line-height: 1.5; color: #12263A }
.sh-cerrada-botones { display: flex; flex-wrap: wrap; gap: 10px }
.sh-cerrada-botones a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; text-decoration: none }
.sh-main { padding: 26px 30px 40px; min-width: 0; display: flex; flex-direction: column }

/* ---------- Riel de módulos ---------- */
.sh-lado { position: relative; z-index: 20; width: 64px }

.sh-lado .riel {
  position: fixed;
  top: calc(70px + var(--sh-aire) + env(safe-area-inset-top)); left: 0; bottom: 0;
  width: 64px;
  overflow: hidden;
  background: var(--sh-tinta);
  border-right: 1px solid rgba(255,255,255,.08);
  display: flex;
  flex-direction: column;
  padding-bottom: 10px;
  transition: width .18s ease, box-shadow .18s ease;
}
.sh-lado:hover .riel,
.sh-lado:focus-within .riel,
.sh-marco.anclado .sh-lado .riel { width: 236px }
.sh-lado:hover .riel,
.sh-lado:focus-within .riel { box-shadow: 26px 0 50px -32px rgba(4,32,63,.85) }

.sh-lado .texto { opacity: 0; transition: opacity .12s ease; white-space: nowrap }
.sh-lado:hover .texto,
.sh-lado:focus-within .texto,
.sh-marco.anclado .sh-lado .texto { opacity: 1 }

.sh-lado .grupo {
  padding: 0 0 8px 22px; margin-top: 20px; font-size: 10.5px; font-weight: 600;
  letter-spacing: .16em; color: var(--c-6f87a5); opacity: 0; transition: opacity .12s; height: 14px;
}
.sh-lado:hover .grupo,
.sh-lado:focus-within .grupo,
.sh-marco.anclado .sh-lado .grupo { opacity: 1 }

.sh-lado .riel a {
  position: relative;
  display: flex; align-items: center; gap: 16px;
  height: 46px; padding-left: 19px;
  font-size: 14.5px; font-weight: 500; color: var(--c-a9c2de); text-decoration: none;
  border-left: 3px solid transparent;
  flex: none;
}
.sh-lado .riel a:hover { background: rgba(255,255,255,.06); color: #fff }
.sh-lado .riel a svg {
  width: 22px; height: 22px; stroke: var(--c-7e97b5); stroke-width: 1.7; fill: none; flex: none;
}
.sh-lado .riel a:hover svg { stroke: var(--c-d6e4f4) }

.sh-lado .riel a.volver { height: 44px; margin-top: 14px; color: var(--c-7e97b5); font-weight: 600; font-size: 13.5px }
.sh-lado .riel a.volver svg { width: 20px; height: 20px }

.sh-lado .riel a.modulo.on {
  color: #fff; font-weight: 700; background: var(--c-marca-velo); border-left-color: var(--sh-rojo);
}
.sh-lado .riel a.modulo.on svg { stroke: var(--sh-rojo) }

.sh-lado .riel a.hijo { padding-left: 38px; height: 42px; font-size: 14px }
.sh-lado .riel a.hijo svg { width: 18px; height: 18px }
.sh-lado .riel a.hijo.on { color: #fff; font-weight: 600; background: rgba(255,255,255,.07) }
.sh-lado .riel a.hijo.on svg { stroke: #fff }
.sh-lado .riel a.hijo.on::before {
  content: ""; position: absolute; left: 29px; top: 11px; bottom: 11px;
  width: 2px; background: var(--sh-rojo); border-radius: 2px;
}

/* Con el riel cerrado, el nombre aparece en un globo: un ícono suelto no
   le dice nada a quien entra por primera vez. */
.sh-lado .riel a .globo {
  position: absolute; left: 70px;
  background: var(--c-0a2f55); color: #fff; font-size: 12.5px; font-weight: 500;
  padding: 6px 11px; border-radius: 2px; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .1s;
  box-shadow: 0 10px 24px -12px rgba(0,0,0,.7);
}
.sh-lado .riel a:hover .globo { opacity: 1 }
.sh-lado:hover .globo,
.sh-lado:focus-within .globo,
.sh-marco.anclado .globo { display: none }

/* ---------- Sello de marca al pie del riel ---------- */
.sh-lado .pie-riel { margin-top: auto; display: flex; flex-direction: column; justify-content: flex-end; min-height: 0 }
.sh-lado .vertical {
  writing-mode: vertical-rl; transform: rotate(180deg); align-self: center;
  font-family: var(--sh-titulo); font-weight: 800; font-size: 12.5px; letter-spacing: .34em;
  color: rgba(255,255,255,.28); padding: 20px 0;
}
.sh-lado:hover .vertical,
.sh-lado:focus-within .vertical,
.sh-marco.anclado .vertical { display: none }

.sh-lado .sello {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 14px; justify-content: center;
  margin: 0 10px 12px; padding: 14px 0; border-radius: 3px; background: rgba(255,255,255,.05);
}
.sh-lado .sello .tajo {
  display: none; position: absolute; top: -30%; bottom: -30%; right: -16px; width: 54px;
  background: var(--sh-rojo); opacity: .9; transform: skewX(-26deg);
}
.sh-lado .sello img { width: 34px; height: 34px; flex: none; position: relative }
.sh-lado .sello .letras { position: relative; line-height: 1.25; display: none }
.sh-lado:hover .sello,
.sh-lado:focus-within .sello,
.sh-marco.anclado .sello { justify-content: flex-start; padding: 14px 12px }
.sh-lado:hover .sello .tajo,
.sh-lado:focus-within .sello .tajo,
.sh-marco.anclado .sello .tajo { display: block }
.sh-lado:hover .sello .letras,
.sh-lado:focus-within .sello .letras,
.sh-marco.anclado .sello .letras { display: block }
.sh-lado .sello .letras b {
  display: block; font-family: var(--sh-titulo); font-weight: 900; font-size: 17px;
  letter-spacing: .02em; color: #fff;
}
.sh-lado .sello .letras span { font-size: 11.5px; color: var(--c-8fb6e8); letter-spacing: .04em }

/* ---------- Anclar ---------- */
.sh-lado .anclar {
  display: flex; align-items: center; gap: 16px; height: 44px; padding-left: 19px;
  border: 0; background: none; color: var(--c-7e97b5); font: 600 13px var(--sh-texto); cursor: pointer;
  border-top: 1px solid rgba(255,255,255,.08); flex: none;
}
.sh-lado .anclar:hover { color: #fff; background: rgba(255,255,255,.06) }
.sh-lado .anclar svg {
  width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.9; fill: none; flex: none;
  transition: transform .18s;
}
.sh-marco.anclado .anclar svg { transform: rotate(180deg) }

/* ---------- Pantallas medianas y chicas ---------- */
@media (max-width: 1180px) {
  .sh-marco, .sh-marco.anclado, .sh-marco.sin-riel { grid-template-columns: 1fr }
  .sh-lado { width: auto; min-width: 0 }
  .sh-lado .riel {
    position: static; width: 100%; max-width: 100%; flex-direction: row;
    overflow-x: auto; overflow-y: hidden; padding: 0;
    border-right: 0; border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .sh-lado:hover .riel, .sh-lado:focus-within .riel { width: 100%; box-shadow: none }
  .sh-lado .anclar,
  .sh-lado .riel a.volver,
  .sh-lado .riel a .globo,
  .sh-lado .pie-riel,
  .sh-lado .grupo { display: none }
  .sh-lado .texto { opacity: 1 }
  .sh-lado .riel a { border-left: 0; border-bottom: 3px solid transparent; padding: 0 18px }
  .sh-lado .riel a.hijo { padding-left: 18px }
  .sh-lado .riel a.hijo.on::before { display: none }
  .sh-lado .riel a.modulo.on,
  .sh-lado .riel a.hijo.on { border-bottom-color: var(--sh-rojo) }
}

@media (max-width: 900px) {
  /* El turno no es crítico y le quita el aire a las migas de pan. */
  .sh-barra .der .turno { display: none }
  .sh { --sh-aire: 24px }
}

@media (max-width: 720px) {
  .sh-main { padding: 18px 18px 30px }
  .sh-barra { gap: 14px; padding-right: 16px }
  .sh-barra .esquina { width: 56px }
  /* En el celular: las migas sencillas, sin menús que se abran. */
  .sh-barra .ruta-pc { display: none }
  .sh-barra .ruta-cel { display: flex; overflow: hidden }
  .sh-barra .ruta-cel .hoja { overflow: hidden; text-overflow: ellipsis }
  .sh-barra .der { gap: 10px }
}

/* ====================== Texto grande (equipos de piso) ======================
   Se activa desde Mi perfil › Preferencias. Sube el tamaño base de la app;
   como casi todo está en px no hereda solo, así que se tocan las piezas que
   de verdad se leen y se tocan con guantes: tablas, campos y botones. */
.sh[data-grande="si"] { font-size: 17px }
.sh[data-grande="si"] .tabla th,
.sh[data-grande="si"] .tabla td,
.sh[data-grande="si"] .qb tbody td { font-size: 15px; padding-top: 12px; padding-bottom: 12px }
.sh[data-grande="si"] .campo,
.sh[data-grande="si"] .pf-campo input,
.sh[data-grande="si"] .pf-campo select,
.sh[data-grande="si"] .qb .disparo { height: 54px; font-size: 17px }
.sh[data-grande="si"] .btn-primario,
.sh[data-grande="si"] .btn-secundario,
.sh[data-grande="si"] .pf-btn,
.sh[data-grande="si"] .qb .chip { min-height: 54px; font-size: 16px }
.sh[data-grande="si"] .etiqueta,
.sh[data-grande="si"] .pf-campo label { font-size: 15px }
.sh[data-grande="si"] .sh-datos span,
.sh[data-grande="si"] .pf-reglas li { font-size: 14px }

/* ============================================================================
   LA PUERTA CERRADA: CAMBIAR LA CLAVE PROVISIONAL
   ---------------------------------------------------------------------------
   Vive AQUÍ, en el cascarón, y no en su propia hoja: la pantalla se dibuja
   desde (app)/layout.tsx reemplazando la aplicación entera, y esta hoja es la
   única que existe seguro en ese momento. Una hoja aparte que el layout no
   importe sale sin estilos, que es exactamente el error que ya nos pasó con
   el aviso de ubicación en Certificar.

   Todas las clases van con prefijo cp- por la misma razón que las del
   calendario van con mes-: globals.css tiene clases sueltas y sin dueño
   (.pie, .vacio, .campo, .panel) que se cuelan en cualquier pantalla.

   El acento NUNCA se usa como color de texto: en ámbar (#FFC000) sobre
   blanco da 1,7:1 y no se lee. El acento va de FONDO —con --c-marca-txt
   encima, que es el par pensado para eso— o de raya.
   ========================================================================== */
.cp {
  height: 100dvh;
  overflow-y: auto;            /* la página no rueda; rueda esta caja */
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    radial-gradient(1100px 520px at 50% -10%, var(--c-marca-velo), transparent 70%),
    var(--bv-tinta);
}

.cp-caja {
  position: relative;
  width: 100%;
  max-width: 460px;
  background: var(--bv-panel, #fff);
  border: 1px solid var(--bv-linea);
  border-radius: 3px;
  padding: 32px 30px 30px;
  box-shadow: 0 18px 44px rgba(4, 32, 63, .10), 0 2px 6px rgba(4, 32, 63, .05);
  overflow: hidden;
}
/* La raya del tema arriba: es lo único que dice de qué color va la casa. */
.cp-caja::before {
  content: "";
  position: absolute; inset: 0 0 auto 0; height: 4px;
  background: var(--c-marca);
}

.cp-ojo {
  margin: 0 0 8px;
  font-size: 10.5px; font-weight: 700;
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--bv-texto-2);
  display: flex; align-items: center; gap: 8px;
}
.cp-ojo::before {
  content: ""; width: 16px; height: 3px; border-radius: 2px;
  background: var(--c-marca);
}

.cp-caja h1 {
  margin: 0 0 10px;
  font-size: 25px; font-weight: 700; line-height: 1.2;
  letter-spacing: -.01em;
  color: var(--bv-texto);
  text-wrap: balance;
}

.cp-dice {
  margin: 0 0 22px;
  font-size: 13px; line-height: 1.55;
  color: var(--bv-texto-2);
}
.cp-dice b { color: var(--bv-texto); font-weight: 600 }

.cp-campos { display: grid; gap: 14px }
.cp-campos label { display: block }
.cp-campos label > span {
  display: block; margin-bottom: 6px;
  font-size: 12px; font-weight: 600;
  color: var(--bv-texto);
}
.cp-campos input {
  width: 100%; height: 46px;
  padding: 0 14px;
  font-size: 15px; font-family: inherit;
  color: var(--bv-texto);
  background: var(--bv-tinta);
  border: 1px solid var(--bv-linea);
  border-radius: 3px;
  outline: none;
  transition: border-color .12s, box-shadow .12s, background .12s;
}
.cp-campos input:focus {
  background: #fff;
  border-color: var(--c-marca-filo);
  box-shadow: 0 0 0 3px var(--c-marca-velo);
}

/* El campo con el ojo. El botón va DENTRO, y el input le deja el sitio
   con padding-right: si fuera position:absolute encima, el texto largo
   pasaría por debajo del ícono. */
.cp-caja-clave { position: relative }
.cp-caja-clave input { padding-right: 46px }
.cp-caja-clave button {
  position: absolute; top: 0; right: 0;
  width: 44px; height: 46px;
  display: grid; place-items: center;
  background: none; border: 0; cursor: pointer;
  color: var(--bv-texto-2);
  border-radius: 0 3px 3px 0;
}
.cp-caja-clave button:hover { color: var(--bv-texto) }
.cp-caja-clave button:focus-visible {
  outline: 2px solid var(--c-marca-filo); outline-offset: -2px;
}

.cp-reglas {
  list-style: none;
  margin: 16px 0 0; padding: 0;
  display: flex; flex-wrap: wrap; gap: 6px 8px;
}
.cp-reglas li {
  display: flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 500;
  color: var(--c-5b6b7f);
  background: var(--bv-tinta);
  border: 1px solid var(--bv-linea);
  border-radius: 3px;
  padding: 5px 11px 5px 9px;
}
.cp-reglas li::before {
  content: ""; width: 6px; height: 6px; border-radius: 2px;
  background: #cbd5e1;
}
/* El verde del "ya cumple" es fijo en los cuatro temas: quiere decir
   "correcto", no "esta app es verde". #146C43 da 5,6:1 sobre blanco. */
.cp-reglas li.ok {
  color: #146c43;
  background: #e8f5ee;
  border-color: #bfe0cd;
}
.cp-reglas li.ok::before { background: #146c43 }

.cp-mal {
  margin: 14px 0 0;
  font-size: 12.5px; font-weight: 500; line-height: 1.45;
  color: var(--c-alarma);
  background: var(--bv-tinta);
  border: 1px solid var(--c-alarma);
  border-left-width: 3px;
  border-radius: 3px;
  padding: 9px 12px;
}

.cp-btn {
  margin-top: 20px;
  width: 100%; min-height: 46px;
  font-size: 14.5px; font-weight: 600; font-family: inherit;
  color: var(--c-marca-txt);
  background: var(--c-marca);
  border: 0; border-radius: 3px;
  cursor: pointer;
  transition: background .12s, transform .06s;
}
.cp-btn:hover:not(:disabled) { background: var(--c-marca-vivo) }
.cp-btn:active:not(:disabled) { transform: translateY(1px) }
.cp-btn:focus-visible { outline: 2px solid var(--bv-texto); outline-offset: 2px }
.cp-btn:disabled { opacity: .45; cursor: not-allowed }

@media (max-width: 480px) {
  .cp { padding: 14px; place-items: start center }
  .cp-caja { padding: 26px 20px 24px; border-radius: 3px }
  .cp-caja h1 { font-size: 22px }
}

/* Texto grande (equipos de piso). */
.sh[data-grande="si"] .cp-campos input,
.sh[data-grande="si"] .cp-caja-clave button { height: 54px }
.sh[data-grande="si"] .cp-btn { min-height: 54px; font-size: 16px }
.sh[data-grande="si"] .cp-reglas li { font-size: 13px }
.sh[data-grande="si"] .cp-dice { font-size: 14.5px }

/* ---------- El celular respira: la puerta cerrada ----------
   Medido a 360x640: el rótulo iba en 10,5px y las reglas en 11,5. */
@media (max-width: 700px) {
  .cp-ojo    { font-size: 11.5px; letter-spacing: .14em }
  .cp-dice   { font-size: 14px; line-height: 1.6 }
  .cp-reglas li { font-size: 12.5px; padding: 7px 13px 7px 11px }
  .cp-campos label > span { font-size: 13px }
  .cp-campos input { height: 50px; font-size: 16px }
  .cp-caja-clave button { height: 50px; width: 48px }
  .cp-btn { min-height: 50px; font-size: 15.5px }
}

/* ---------- El celular respira ----------
   Generado desde la auditoría de densidad y comprobado midiendo: la
   letra sube al suelo de lectura y los botones al blanco que pide un
   dedo. Solo aplica en pantalla chica; en escritorio no cambia nada. */
@media (max-width: 700px) {
  /* Letra que no se leía */
  .sh-lado .grupo { font-size: 12px }
  .sh-lado .sello .letras span { font-size: 12px }

  /* Blancos de toque cortos.
     El hijo del riel quedaba en 42px: dos por debajo del mínimo, y es
     el enlace que más se toca en toda la aplicación. */
  .sh-lado .riel a.hijo { height: 44px }
}

/* EL BOTÓN FLOTANTE DE ACTUALIZAR: pequeño, rectangular, abajo a la derecha. Gira mientras actualiza. */
.sh-refrescar {
  position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 35;
  width: 40px; height: 40px; padding: 0; display: grid; place-items: center; cursor: pointer; border-radius: 0;
  background: transparent; color: var(--sh-azul); border: 0; box-shadow: none;
}
/* SIN FONDO: solo la figurita. Un halo blanco fino la separa de lo que quede detrás. */
.sh-refrescar svg {
  width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;
  filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 2px #fff);
}
.sh-refrescar:hover:not(:disabled) svg { transform: scale(1.12) }
.sh-refrescar:focus-visible { outline: 2px solid var(--sh-azul); outline-offset: 2px }
.sh-refrescar:disabled { cursor: progress }
.sh-refrescar.gira svg { animation: sh-gira .8s linear infinite }
.sh-refrescar-ok {
  position: absolute; right: 100%; top: 50%; transform: translateY(-50%); margin-right: 8px; white-space: nowrap;
  background: var(--sh-tinta); color: #fff; font: 600 12.5px var(--sh-texto); padding: 6px 10px; pointer-events: none;
}
.sh-refrescar-ok:empty { display: none }
@keyframes sh-gira { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .sh-refrescar.gira svg { animation: none; opacity: .5 } }
/* Donde hay un «+» flotante a la vista (Roturas, Acciones, Vh Interno) se pone justo encima, sin taparlo; si no, va pegado abajo. */
.sh-refrescar[data-sube="si"] { bottom: calc(92px + env(safe-area-inset-bottom)); right: 28px }

/* LA FRANJA «ESTO ES UNA COPIA»: rectangular, bajo la barra superior, a todo el ancho. */
.sh .sh-copia {
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 14px;
  padding: 8px 16px; background: #fff3cd; color: #4a3500; border-bottom: 2px solid #e0a800;
  font-size: 13px; line-height: 1.35; text-align: center;
}
.sh .sh-copia button {
  min-height: 32px; padding: 0 14px; border-radius: 0; border: 1px solid #4a3500; background: #4a3500; color: #fff;
  font: inherit; font-weight: 600; cursor: pointer;
}


/* EL SUBGRUPO DEL MENÚ (Pasivos dentro de Balance): la entrada del grupo con su flechita, y sus
   pantallas un nivel más adentro. Con el riel cerrado (64px) el icono del nieto sigue cabiendo. */
.sh-lado .riel a.hijo.sub .flecha { width: 14px; height: 14px; margin-left: auto; margin-right: 16px; opacity: .7 }
.sh-lado .riel a.hijo.sub.abierto { color: #fff; font-weight: 600 }
.sh-lado .riel a.hijo.sub.abierto svg { stroke: #fff }
.sh-lado .riel a.hijo.nieto { padding-left: 46px; height: 38px; font-size: 13.5px }
.sh-lado .riel a.hijo.nieto svg { width: 16px; height: 16px }
.sh-lado .riel a.hijo.nieto::after {
  content: ""; position: absolute; left: 38px; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.14);
}
.sh-lado .riel a.hijo.nieto.on::before { left: 37px; top: 9px; bottom: 9px }
@media (max-width: 1180px) {
  .sh-lado .riel a.hijo.nieto { padding-left: 18px; height: 46px }
  .sh-lado .riel a.hijo.nieto::after, .sh-lado .riel a.hijo.sub .flecha { display: none }
}
/* ---------------------------------------------------------------------
   5S — todo cuelga de .s5. Recto, blanco con ámbar, como el resto de CONTROL.
   Letras: Archivo (títulos y cifras) + IBM Plex Sans (texto).
   La escala de los informes (carbón, ocre, amarillo, crema) para la severidad;
   el rojo de Bavaria solo para lo que no cumple y las cifras bajo la meta.
   --------------------------------------------------------------------- */
.s5 {
  --s5-tinta: var(--c-04203f, #0d0d0d);
  --s5-marca: var(--c-marca, #FFC000);
  --s5-gris: var(--c-5b6b7f, #5b6b7f);
  --s5-linea: var(--c-d5dce5, #d5dce5);
  --s5-fondo: #F4F5F7;
  --s5-carbon: #3B3B3B; --s5-ocre: #B58200; --s5-ocre-txt: #8A6300; --s5-amarillo: #FFC300; --s5-crema: #FFF1C2;
  --s5-rojo: #C8102E; --s5-rojo-suave: #FDECEE;
  --s5-titulo: "Archivo", system-ui, sans-serif;
  --s5-texto: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  font-family: var(--s5-texto); color: var(--s5-tinta);
  display: flex; flex-direction: column; gap: 14px;
}
.s5 *, .s5 *::before, .s5 *::after { box-sizing: border-box }
.s5 button, .s5 input, .s5 select, .s5 textarea { font-family: inherit; border-radius: 0 }
.s5 :is(button, a, input, select, textarea, summary):focus-visible { outline: 3px solid var(--s5-marca); outline-offset: 2px }

/* CABECERA */
.s5-cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap }
.s5-ojo { margin: 0; font: 700 11px var(--s5-texto); letter-spacing: .16em; color: var(--s5-gris) }
.s5-cab h1 { margin: 4px 0 0; font: 900 30px/1.05 var(--s5-titulo); letter-spacing: -.03em }
.s5-sub { margin: 6px 0 0; font-size: 13px; color: var(--s5-gris) }
.s5-acc { display: flex; gap: 8px; flex-wrap: wrap }
.s5-aviso { margin: 0; padding: 9px 14px; font-size: 13px; font-weight: 700; background: color-mix(in srgb, var(--s5-marca) 22%, #fff); border-left: 4px solid var(--s5-marca) }
.s5-aviso a { color: inherit; font-weight: 800 }
.s5-aviso.mal { background: var(--s5-rojo-suave); border-left-color: var(--s5-rojo); color: #7A0A1C }
.s5-vacio { margin: 0; padding: 28px 18px; background: #fff; border: 1px solid var(--s5-linea); color: var(--s5-gris); font-size: 14px; line-height: 1.5 }
.s5-vacio b { color: var(--s5-tinta) }

/* BOTONES */
.s5-bt { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border: 1.5px solid var(--s5-tinta); background: #fff; color: var(--s5-tinta); font: 800 13px var(--s5-texto); cursor: pointer; white-space: nowrap; text-decoration: none }
.s5-bt.osc { background: var(--s5-amarillo); border-color: var(--s5-amarillo); color: #1b1b1b; box-shadow: inset 0 -3px 0 var(--s5-ocre) }
.s5-bt.peligro { color: var(--s5-rojo); border-color: var(--s5-rojo) }
.s5-bt:disabled { opacity: .5; cursor: not-allowed }
.s5-bt svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
